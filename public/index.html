<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>Chalk Line — WUCC 2026 scores, stats and predictions</title>
<meta name="description" content="Live scores, results, model rankings and point-by-point stats for every game at the World Ultimate Club Championships 2026.">
<style>
:root{
  --bg:#0a0c10; --surface:#141820; --surface-2:#1c212b; --line:#262d3a;
  --text:#e9edf3; --muted:#8792a4; --dim:#5c6678;
  --up:#00d47e; --down:#ff4d5e; --accent:#f4f7fb; --chalk:#c8d2e0;
  /* Neither half of a defensive point is good or bad, so neither may wear
     --up or --down. Blue/amber, validated against this surface for dark mode
     and colour vision deficiency: CVD dE 19.7 protan, 26.3 tritan. */
  --brk:#2f93c4; --con:#c8762f;
  --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden;
  font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:var(--chalk)}
.hide{display:none !important}

/* ---- chrome ---- */
header{
  position:sticky;top:0;z-index:40;background:rgba(10,12,16,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:900px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:800;letter-spacing:-.02em;font-size:17px;flex-shrink:0}
.brand .mark{width:22px;height:3px;background:var(--chalk);border-radius:2px;display:inline-block;margin-bottom:3px}
nav{display:flex;gap:2px;padding:0 10px 10px;max-width:900px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap
}
nav button.on{background:var(--surface-2);color:var(--text)}
main{max-width:900px;margin:0 auto;padding:14px 12px 120px}

/* ---- cards ---- */
.day{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);
  margin:22px 4px 8px;font-weight:700}
.day:first-child{margin-top:4px}
.dayhead{width:100%;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0 8px;
  font-size:14px;font-weight:700;letter-spacing:-.01em}
.dayhead.on{background:var(--surface-2);border-color:#2f3846}
.dayhead .dh-l{flex:1;text-align:left}
.dayhead .dh-n{font-size:11.5px;font-weight:600;color:var(--dim)}
.dayhead .dh-c{width:16px;text-align:center;color:var(--dim);font-size:16px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 12px;margin-bottom:8px}
.meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--dim);margin-bottom:9px}
.pill{background:var(--surface-2);padding:2px 7px;border-radius:5px;font-weight:600;letter-spacing:.02em}
.meta .t{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:7px}
/* Grid items default to min-width:auto, so a long club name blows the row out
   sideways on a phone. Both the cell and the text block have to be allowed to
   shrink before the ellipsis can do its job. */
.side{background:var(--surface-2);border:1px solid transparent;border-radius:9px;
  padding:9px 10px;display:flex;align-items:center;gap:8px;text-align:left;
  min-width:0;overflow:hidden}
.side .nm{flex:1;min-width:0;overflow:hidden}
.side .n1{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .n2{font-size:10.5px;color:var(--dim);margin-top:1px}
/* This slot held the decimal odds and was green, because a price is something
   you either take or leave. It now holds a win probability, and the two halves
   of one are not a good side and a bad side — so it is uncoloured, the same
   decision .winpct already makes about the pair of numbers under the bar. */
.side .od{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;color:var(--text)}
.empty{text-align:center;color:var(--dim);padding:50px 20px;font-size:14px}
.game.live{border-color:#2b3a44}
.livenote{font-size:11.5px;color:var(--dim);line-height:1.5;margin:0 4px 12px}
.livenote strong{color:var(--muted)}
.livebanner{width:100%;display:flex;align-items:center;gap:9px;margin:0 0 12px;
  padding:11px 13px;border-radius:10px;background:#12211c;border:1px solid #1e3a30}
.livebanner .dot{width:7px;height:7px;border-radius:50%;background:var(--up);flex:none;
  box-shadow:0 0 0 3px rgba(0,212,126,.18)}
.livebanner .lb-t{font-weight:700;font-size:13.5px}
.livebanner .lb-s{margin-left:auto;font-size:11.5px;color:var(--up);font-weight:600}
.livescore{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:2px 0 8px}
.livescore .ls-n{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.livescore .ls-s{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.livescore .ls-d{color:var(--dim);margin:0 3px}
.winbar{height:4px;background:var(--down);border-radius:99px;overflow:hidden}
.winbar span{display:block;height:100%;background:var(--up);transition:width .4s ease}
.winpct{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);
  font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.spnote{font-size:10.5px;color:var(--dim);line-height:1.45;padding:2px 2px 0}
.game .spnote{margin-top:8px}


/* ---- stats ---- */
.stat-tabs{display:flex;gap:6px;margin:0 2px 10px;overflow-x:auto;scrollbar-width:none}
.stat-tabs::-webkit-scrollbar{display:none}
.stat-tabs button{padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;
  color:var(--muted);background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.stat-tabs button.on{background:var(--surface-2);color:var(--text);border-color:#2f3846}
.cov{font-size:11px;color:var(--dim);line-height:1.5;margin:0 4px 12px;padding:9px 11px;
  background:var(--surface);border:1px solid var(--line);border-radius:9px}
.cov b{color:var(--muted);font-weight:700}
.mnote{font-size:11px;color:var(--dim);line-height:1.5;margin:8px 4px 18px}


.rail-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;margin-bottom:14px}
.rl{display:grid;grid-template-columns:18px minmax(0,1fr) 56px;gap:9px;align-items:center;
  padding:10px 12px;border-bottom:1px solid var(--line)}
.rl:last-child{border-bottom:none}
.rl.thin{opacity:.5}
.rl-rk{font-size:11px;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
.rl-main{min-width:0}
.rl-name{display:flex;align-items:baseline;gap:6px;font-size:14px;font-weight:650;min-width:0}
.rl-name .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
.rl-name .ctry{flex:0 1 auto;font-size:11px;font-weight:500;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-rail{position:relative;display:block;height:8px;margin:7px 0 5px}
.rl-w{position:absolute;left:0;top:0;bottom:0;background:#232c39;border-radius:99px}
.rl-p{position:absolute;left:0;top:0;bottom:0;border-radius:99px;
  background:linear-gradient(90deg,#0d7d4c,#00d47e)}
.rl-p.under{background:#48566b}
.rl-p.neutral{background:linear-gradient(90deg,#6b5ea8,#9b8ad6)}
.rl-par{position:absolute;top:-3px;width:2px;height:14px;background:var(--chalk);
  opacity:.7;border-radius:1px;text-decoration:none}
.rl-sub{display:block;font-size:11px;color:var(--dim);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.rl-val{text-align:right;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;color:var(--muted)}
.rl-val.up{color:var(--up)}
/* Unscoped, because a club name is now tappable from four different lists and
   the dotted underline is the only thing telling a reader there is a profile
   behind it. Wherever the name goes, the affordance goes with it. */
.who.tap{cursor:pointer;border-bottom:1px dotted var(--dim)}

/* club profile */
.pfhead{padding:2px 4px 12px}
.pfhead .pfn{font-size:22px;font-weight:800;letter-spacing:-.01em}
.pfhead .pfm{font-size:11.5px;color:var(--dim);margin-top:3px}
.pfhead .pfs{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.pf{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;margin-bottom:6px}
.pf .pr{display:grid;grid-template-columns:minmax(0,1fr) 96px 62px;gap:10px;align-items:center;
  padding:9px 12px;border-bottom:1px solid var(--line)}
.pf .pr:last-child{border-bottom:none}
.pf .pr.thin{opacity:.45}
.pf .pl{font-size:12.5px;font-weight:650;min-width:0}
.pf .pl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf .pl u{display:block;text-decoration:none;font-size:10.5px;color:var(--dim);
  font-weight:500;line-height:1.35;margin-top:1px}
.dev{position:relative;display:block;height:8px;background:#1a212c;border-radius:99px}
.dev i{position:absolute;top:0;bottom:0;border-radius:99px;background:#48566b}
.dev i.good{background:var(--up)}
.dev i.neutral{background:linear-gradient(90deg,#6b5ea8,#9b8ad6)}
.dev s{position:absolute;top:-3px;width:2px;height:14px;background:var(--chalk);
  opacity:.7;transform:translateX(-1px)}
.pf .pv{text-align:right;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.pf .pv.up{color:var(--up)}
.pf .pv u{display:block;text-decoration:none;font-size:10px;color:var(--dim);font-weight:600}
.lb .nm .arw{color:var(--dim);font-weight:500;padding:0 2px}
.dsh{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 14px 11px;margin:0 0 6px}
.dsh .dh{font-size:12.5px;font-weight:650}
.dsh .dc{font-size:10.5px;color:var(--dim);line-height:1.45;margin:2px 0 13px}
.dbar{position:relative;height:26px;margin-bottom:3px}
.dbar .dax{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--chalk);
  opacity:.55;transform:translateX(-1px)}
.dbar i{position:absolute;height:7px;border-radius:99px}
.dbar i.b{top:2px;background:var(--brk)}
.dbar i.c{top:16px;background:var(--con)}
.dsh .dends{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);
  margin-bottom:9px}
.dsh .dkey{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:11px;
  color:var(--muted);font-variant-numeric:tabular-nums}
.dsh .dkey i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;
  vertical-align:-1px}
.dsh .dkey b{margin-left:auto;color:var(--text);font-weight:800}
.rl-shape{position:relative;display:block;height:17px;margin:7px 0 5px}
.rl-shape s{position:absolute;top:-2px;bottom:-2px;width:2px;text-decoration:none;
  background:var(--chalk);opacity:.55;transform:translateX(-1px)}
.rl-shape u{position:absolute;top:1px;bottom:1px;width:1px;text-decoration:none;
  background:var(--dim);opacity:.5;transform:translateX(-.5px)}
.rl-shape i{position:absolute;height:6px;border-radius:99px}
.rl-shape i.b{top:1px;background:var(--brk)}
.rl-shape i.c{top:10px;background:var(--con)}
.shapekey{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:11px;
  color:var(--dim);margin:0 4px 10px}
.shapekey i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;
  vertical-align:-1px}

/* ---- buttons ---- */
.btn{background:var(--chalk);color:#0b0e13;font-weight:800;padding:11px 18px;border-radius:9px;font-size:14px}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--surface-2);color:var(--text);font-weight:600}

/* ---- tables / lists ---- */
.lb{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.lb .r{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
.lb .r:last-child{border-bottom:none}
.lb .rk{width:22px;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums;font-size:12px}
.lb .nm{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .v{font-weight:700;font-variant-numeric:tabular-nums}
.sub{font-size:11px;color:var(--dim);font-weight:500}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);
  border-radius:99px;padding:10px 14px;font-size:15px}
.search input::placeholder{color:var(--dim)}
.search button{padding:0 14px;border-radius:99px;background:var(--surface);
  border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600}
.teamchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);
  border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;margin:0 6px 6px 0}
.teamchip .s{color:var(--dim);font-weight:500;font-size:11px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:6px 12px;border-radius:99px;background:var(--surface);font-size:12.5px;
  font-weight:600;color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.tabs button.on{background:var(--chalk);color:#0b0e13;border-color:var(--chalk)}

/* ---- modal ---- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(6,8,11,.86);
  display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:22px;width:100%;max-width:380px;max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:19px;letter-spacing:-.01em}
.sheet p.lede{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.5}
.sheet label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--dim);margin:12px 0 5px;font-weight:700}
.sheet input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:16px}
.sheet .btn{width:100%;margin-top:18px;padding:12px}
.err{color:var(--down);font-size:12.5px;margin-top:10px;line-height:1.4}
.note{color:var(--dim);font-size:11.5px;margin-top:14px;line-height:1.5;text-align:center}
.switch{text-align:center;margin-top:14px;font-size:13px;color:var(--muted)}
.switch button{color:var(--chalk);font-weight:600;text-decoration:underline}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:200;
  background:var(--surface-2);border:1px solid var(--line);padding:10px 16px;border-radius:99px;
  font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5)}
footer{max-width:900px;margin:0 auto;padding:26px 16px 40px;color:var(--dim);font-size:11px;
  line-height:1.6;text-align:center;border-top:1px solid var(--line)}
.adm{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px}
.adm .in{display:flex;gap:6px;margin-top:8px;align-items:center}
.adm input{width:52px;background:var(--bg);border:1px solid var(--line);border-radius:7px;
  padding:8px;text-align:center;font-size:15px;font-weight:700}
.adm .btn{padding:8px 12px;font-size:12.5px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><span class="mark"></span>Chalk&nbsp;Line</div>
  </div>
  <nav id="nav"></nav>
</header>

<main id="view"><div class="empty">Loading the board…</div></main>

<footer>
  Chalk Line is an unofficial fan site. Every score and result comes from the official
  WFDF feed. Not affiliated with WFDF or WUCC.
  <div id="foot"></div>
</footer>

<div id="modal"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const S = { user: null, tab: 'board', div: 'all',
  teamId: null, teamFrom: null, relianceKey: 'total',
            query: '', results: null,
            stats: null, statsDiv: null, statView: 'breaks', statDivision: '',
            days: [], day: null, gamesByDay: {}, openDays: new Set(),
            live: [], liveCount: 0,
            resDiv: '', resDay: null, resDays: [], resGames: [], resLoaded: false,
            rankDiv: '', ranks: [], rankKey: null };

// The three divisions never play each other, so every ranked or filtered view
// offers the same four choices and they may as well be written down once.
const DIVISIONS = [['', 'All divisions'], ['Open', 'Open'], ["Women's", "Women's"], ['Mixed', 'Mixed']];

// The chips assign straight into state, the way the stats page already does.
// The division lands inside a JavaScript string inside an onclick attribute,
// so the apostrophe in "Women's" has to be escaped for that inner string or
// the handler stops parsing halfway through the word.
function divisionChips(current, field) {
  return `<div class="stat-tabs">${DIVISIONS.map(([k, l]) =>
    `<button class="${current === k ? 'on' : ''}"
       onclick="S.${field}='${k.replace(/'/g, "\\'")}';render()">${esc(l)}</button>`).join('')}</div>`;
}

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    method: opts.body ? 'POST' : (opts.method || 'GET'),
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

// --- time: viewer's local clock, Irish event time alongside ----------------
const IRISH = 'Europe/Dublin';
const fmtTime = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const fmtIrish = iso => new Date(iso).toLocaleTimeString('en-IE',
  { hour: '2-digit', minute: '2-digit', timeZone: IRISH });
const dayKey = iso => new Date(iso).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });

// --- chrome ----------------------------------------------------------------
function renderChrome() {
  // Live leads when there is anything live, because a game in progress is the
  // only thing on this site that will not still be here in an hour.
  const tabs = [];
  if (S.liveCount) tabs.push(['live', `Live · ${S.liveCount}`]);
  tabs.push(['board', 'Upcoming'], ['results', 'Results'],
            ['rankings', 'Rankings'], ['stats', 'Stats']);
  if (S.user?.isAdmin) tabs.push(['admin', 'Admin']);
  if (S.user) tabs.push(['out', 'Sign out']);
  // A club profile has no tab of its own, so the nav keeps whichever list you
  // opened it from lit rather than showing nothing selected.
  const lit = S.tab === 'team' ? (S.teamFrom || 'stats') : S.tab;
  $('#nav').innerHTML = tabs.map(([k, l]) =>
    `<button class="${lit === k ? 'on' : ''}" onclick="go('${k}')">${esc(l)}</button>`).join('');

  // There is nothing here for a visitor to sign up to any more — the only
  // account that does anything is the one that settles games. So sign-in is a
  // footer link that says what it is for, rather than a prompt in the header.
  $('#foot').innerHTML = S.user ? ''
    : `<button onclick="openLogin()" style="color:var(--dim);text-decoration:underline;
         font-size:11px;margin-top:8px">Admin</button>`;
}

async function go(tab) {
  if (tab === 'out') {
    await api('/logout', { method: 'POST' });
    S.user = null; S.tab = 'board'; renderChrome(); return render();
  }
  S.tab = tab; renderChrome(); render();
}

// --- board -----------------------------------------------------------------
async function loadGames(day) {
  const d = await api('/games' + (day ? '?day=' + encodeURIComponent(day) : ''));
  if (typeof d.liveNow === 'number') S.liveCount = d.liveNow;
  S.days = d.days || [];
  S.day = d.day;
  S.gamesByDay[d.day] = d.games;
  // Whichever day arrived first is the one open on arrival.
  if (!S.openDays.size && d.day) S.openDays.add(d.day);
}

// The board answers instantly from stored data; refreshing the WFDF feed
// happens in its own request so a slow pull never delays the page. If it
// actually changed something, redraw.
let ticking = false;
let nextTickAt = 0;
async function tick() {
  // The server refuses more than one refresh every three minutes anyway, so
  // asking every render just burns a request per tab. Jittered, so a crowd
  // doesn't arrive in lockstep.
  const now = Date.now();
  if (ticking || now < nextTickAt) return;
  nextTickAt = now + 180000 + Math.floor(Math.random() * 60000);
  ticking = true;
  try {
    const r = await api('/tick');
    if (!r.skipped && (r.settled > 0 || r.games?.created > 0 || r.games?.teamsResolved > 0)) {
      await loadGames();
      if (S.tab === 'board') $('#view').innerHTML = renderBoard();
    }
  } catch {
    // A failed refresh is invisible on purpose — the board still has data.
  } finally { ticking = false; }
}

function renderBoard() {
  if (S.query) return renderSearch();
  const divs = ['all', 'Open', "Women's", 'Mixed'];
  let html = searchBar();
  if (S.liveCount) {
    html += `<button class="livebanner" onclick="go('live')">
      <span class="dot"></span>
      <span class="lb-t">${S.liveCount} game${S.liveCount === 1 ? '' : 's'} in play</span>
      <span class="lb-s">Follow the score &rsaquo;</span>
    </button>`;
  }
  html += `<div class="tabs">${divs.map(d =>
    `<button class="${S.div === d ? 'on' : ''}" onclick="S.div='${d.replace(/'/g, "\\'")}';render()">${d === 'all' ? 'All' : d}</button>`).join('')}</div>`;

  if (!S.days.length) {
    return html + `<div class="empty">Nothing scheduled right now.<br>
      <span style="font-size:12px">Fixtures appear as soon as the next round is drawn.</span></div>`;
  }

  for (const d of S.days) {
    const open = S.openDays.has(d.day);
    const loaded = S.gamesByDay[d.day];
    html += `<button class="dayhead ${open ? 'on' : ''}" onclick="toggleDay('${d.day}')">
      <span class="dh-l">${dayLabel(d.day)}</span>
      <span class="dh-n">${d.games} game${d.games === 1 ? '' : 's'}</span>
      <span class="dh-c">${open ? '&minus;' : '+'}</span>
    </button>`;
    if (!open) continue;
    if (!loaded) { html += `<div class="empty" style="padding:20px">Loading…</div>`; continue; }
    const shown = S.div === 'all' ? loaded : loaded.filter(g => g.division === S.div);
    if (!shown.length) {
      html += `<div class="empty" style="padding:20px">Nothing in ${esc(S.div)} on this day.</div>`;
      continue;
    }
    for (const g of shown) html += gameCard(g);
  }
  return html;
}

// "Today", "Tomorrow", then the weekday — the tournament is short enough that
// nobody thinks in dates.
function dayLabel(iso) {
  const d = new Date(iso + 'T12:00:00Z');
  const today = new Date();
  const diff = Math.round((d - new Date(today.toISOString().slice(0, 10) + 'T12:00:00Z')) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  return d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });
}

async function toggleDay(day) {
  if (S.openDays.has(day)) {
    S.openDays.delete(day);
    $('#view').innerHTML = renderBoard();
    return;
  }
  S.openDays.add(day);
  $('#view').innerHTML = renderBoard();
  if (!S.gamesByDay[day]) {
    // Only the day you opened is fetched, so the whole schedule can be
    // browsed without ever pulling it all down at once.
    try { await loadGames(day); } catch { S.openDays.delete(day); }
    $('#view').innerHTML = renderBoard();
  }
}

// One fixture: who, when, how likely each side is, and by how much. The
// handicap ladder that used to hang off the bottom of this card was a market
// and has gone with the rest of them; the model's expected margin is the one
// thing it said that was worth keeping, so it is stated outright instead of
// hidden behind an expander.
function gameCard(g) {
  return `<div class="game">
    <div class="meta">
      <span class="pill">${esc(g.division || '')}</span>
      ${g.pool ? `<span>${esc(g.pool)}</span>` : ''}
      <span class="t">${fmtTime(g.startsAt)} · ${fmtIrish(g.startsAt)} Limerick</span>
    </div>
    <div class="sides">${sidePanel(g, 'home')}${sidePanel(g, 'away')}</div>
    ${marginNote(g)}
  </div>`;
}

// `margin` is signed towards the home side and already snapped to half points.
// Anything under a full point is reported as no opinion rather than rounded
// into one: a game the model splits 51/49 has no favourite worth naming, and
// "by 0" would read as a prediction of a draw, which ultimate does not have.
function marginNote(g) {
  const m = Number(g.margin);
  if (!Number.isFinite(m)) return '';
  if (Math.abs(m) < 1) return `<div class="spnote">Model makes this one too close to call.</div>`;
  const t = m > 0 ? g.home : g.away;
  return `<div class="spnote">Model expects ${esc(t.name)} by ${Math.round(Math.abs(m))}.</div>`;
}

function searchBar() {
  return `<div class="search">
    <input id="q" placeholder="Search a club or country" value="${esc(S.query || '')}"
      autocapitalize="off" autocorrect="off" spellcheck="false"
      oninput="onSearch(this.value)">
    ${S.query ? `<button onclick="clearSearch()">Clear</button>` : ''}
  </div>`;
}

let searchTimer = null;
function onSearch(v) {
  clearTimeout(searchTimer);
  // Debounced: one request when they stop typing, not one per keystroke.
  searchTimer = setTimeout(async () => {
    S.query = v.trim();
    if (S.query.length < 2) { S.results = null; return renderKeepingFocus(); }
    try { S.results = await api('/search?q=' + encodeURIComponent(S.query)); }
    catch { S.results = null; }
    renderKeepingFocus();
  }, 250);
}

// Redraw without stealing the caret out of the search box mid-typing.
function renderKeepingFocus() {
  const el = $('#q');
  const pos = el?.selectionStart;
  $('#view').innerHTML = searchHost();
  const again = $('#q');
  if (again && el === document.activeElement || S.query) {
    again?.focus();
    if (pos != null) again?.setSelectionRange(pos, pos);
  }
}

function clearSearch() {
  S.query = ''; S.results = null;
  $('#view').innerHTML = searchHost();
}

// Search sits on both the board and the live tab, so a redraw has to come back
// to whichever one the visitor is actually on. Both callers used to say
// renderBoard() flatly. That was invisible while a query was active — the
// board defers to renderSearch anyway — but it dropped a live viewer onto the
// board the instant they cleared the box, or backspaced to one character.
// Synchronous on purpose: neither caller should refetch, and render() would.
const searchHost = () => (S.tab === 'live' ? renderLive() : renderBoard());

function renderSearch() {
  let html = searchBar();
  const r = S.results;
  if (!r) return html + `<div class="empty">Searching…</div>`;
  if (!r.teams.length) {
    return html + `<div class="empty">Nothing matches “${esc(S.query)}”.<br>
      <span style="font-size:12px">Try a club name, a country, or an abbreviation.</span></div>`;
  }

  html += `<div style="margin-bottom:12px">` + r.teams.map(t =>
    `<span class="teamchip">${teamLink(t)}
      <span class="s">${esc(t.division || '')}${t.seed ? ' · #' + t.seed : ''}</span></span>`).join('') + `</div>`;

  if (r.games.length) {
    html += `<div class="day">Fixtures</div>`;
    let day = '';
    for (const g of r.games) {
      const d = dayKey(g.startsAt);
      if (d !== day) { html += `<div class="day">${d}</div>`; day = d; }
      html += gameCard(g);
    }
  } else {
    html += `<div class="empty" style="padding:30px">Nothing left to play.</div>`;
  }

  if (r.results?.length) {
    html += `<div class="day">Played</div><div class="lb">` + r.results.map(g =>
      `<div class="r"><span class="nm">${esc(g.home.name)} v ${esc(g.away.name)}
        <div class="sub">${esc(g.division || '')} · ${esc(g.pool || '')}</div></span>
        <span class="v">${g.home.score ?? ''}–${g.away.score ?? ''}</span></div>`).join('') + `</div>`;
  }
  return html;
}

function sidePanel(g, side) {
  const t = g[side];
  // No longer a button. It used to place a bet; there is nothing to place, so
  // the panel is inert and only the club name is tappable — through to the
  // profile, like every other club name on the site.
  return `<div class="side">
    <span class="nm"><div class="n1">${teamLink(t)}</div>
      <div class="n2">${esc(t.country || '')}${t.seed ? ' · #' + t.seed : ''}</div></span>
    <span class="od">${winPct(t.prob)}</span></div>`;
}

// A win probability, rounded for display. The two sides of a fixture come off
// the server summing to exactly 1, so rounding each independently is safe.
const winPct = (p) => `${Math.round((Number(p) || 0) * 100)}%`;

// A club name with its profile behind it, or a plain name when the payload
// has no id to link to — /search's played games are the one place that
// happens, and a dotted underline leading nowhere is worse than no underline.
const teamLink = (t) => (t && t.id
  ? `<span class="who tap" onclick="openTeam(${t.id})">${esc(t.name)}</span>`
  : esc(t?.name));

// --- stats dashboard -------------------------------------------------------
//
// Six views over the same payload. Each one leads with a rate and shows the
// count behind it, because a bare count mostly measures how much a team has
// played — and on a page comparing clubs that have played two games with clubs
// that have played four, that would be actively misleading.
const STAT_VIEWS = [
  { key: 'breaks',  label: 'Breaks',
    note: 'Points won while on defence. The rail is every defensive point a club has played; the lit part is the ones they broke. Two clubs on the same percentage no longer look identical — you can see which has done it more often.',
    part: (t) => t.breaks, whole: (t) => t.dPoints, rate: (t) => t.breakPct, min: 10,
    fmt: (t) => pctText(t.breakPct),
    sub: (t) => `${t.breaks} breaks from ${t.dPoints} D points` },

  { key: 'holds',   label: 'Holds',
    note: 'Points held when receiving. The rail is every offensive point played, lit where they held. A team that is never broken only has to break once.',
    part: (t) => t.holds, whole: (t) => t.oPoints, rate: (t) => t.holdPct, min: 10,
    fmt: (t) => pctText(t.holdPct),
    sub: (t) => `${t.holds} holds from ${t.oPoints} O points` },

  { key: 'otime',   label: 'O point length',
    note: 'How long an offensive point takes this club, on average. Shorter is better: a quick point means the disc went down the field cleanly, a long one means turnovers and grinding it back. Averaged rather than totalled, because a total mostly measures how many games a club has played. Quickest first.',
    plain: true, lowerIsBetter: true, min: 10, whole: (t) => t.oClockN,
    value: (t) => (t.oSecsPerPoint === null ? Infinity : t.oSecsPerPoint),
    fmt: (t) => (t.oSecsPerPoint === null ? '—' : `${t.oSecsPerPoint}s`),
    sub: (t) => `${clock(t.oTime)} total on offence, over ${t.oClockN} points` },

  { key: 'dsplit', label: 'D point split', shape: true,
    note: 'Every defensive point ends one of two ways, and the two want reading apart. The chalk line is that club\'s OWN average defensive point; the blue bar is how long their breaks run against it, the amber bar how long their concessions do — left of the line is quicker than their normal, right is slower. Centring each club on itself is the whole trick: in raw seconds both halves are mostly a readout of how fast that club plays in general (r = +0.65 and +0.76 against its own average), so a table of raw seconds would rank tempo and call it defence. Neither end is better and nothing is coloured as good, because across the tournament neither half predicts how often a club actually breaks (r = -0.07 and +0.05). Biggest positive gap first.',
    plain: true, neutral: true, min: 5,
    whole: (t) => Math.min(t.breakClockN || 0, t.concededClockN || 0),
    value: (t) => (dGap(t) === null ? -9999 : dGap(t)),
    fmt: (t) => (dGap(t) === null ? '\u2014' : `${dGap(t) > 0 ? '+' : ''}${dGap(t)}s`),
    sub: (t) => (dGap(t) === null
      ? 'not enough of both halves yet'
      : `${t.secondsPerBreak}s to break, ${t.secondsPerConcededHold}s to concede`) },

  { key: 'spread',  label: 'Star reliance',
    keys: [['goals', 'Goals'], ['assists', 'Assists'], ['total', 'Both']],
    note: 'How much of a club\'s output comes from three people. The rail is everything the club has produced and the lit part is their top three\'s share, so a long rail mostly dark is a squad contributing from everywhere. Neither end is better — a high number is a side with a weapon, and also a side that one shutdown defender or one injury can flatten. Split by goals and assists because they are different fragilities: a side whose assists pile up on one handler loses its engine when that player is marked, while a side whose goals pile up on one cutter still has an engine and nowhere to put the disc. Most concentrated first.',
    part: (t) => rel(t).part, whole: (t) => rel(t).whole, rate: (t) => rel(t).rate, min: 12,
    neutral: true,
    fmt: (t) => (rel(t).rate === null ? '—' : pctText(rel(t).rate)),
    sub: (t) => relianceSub(t) },

  { key: 'combos', label: 'Connections', combos: true,
    note: 'Thrower first, then the scorer. Both ends of every goal are in the WFDF feed, so these pairs have been sitting in the data all tournament — they only become visible once every game is pooled, because a partnership is not a fact about any single game. Pairs who have connected at least twice.' },

  { key: 'timeouts', label: 'After a timeout',
    note: 'Whether calling a timeout actually wins you the next point. Taking them is not the story — every side takes them, and a club that calls four is not doing better or worse than one that calls two. The rail is the points that followed a timeout and the lit part is the ones they went on to score. The line underneath splits those wins into breaks and holds, which are not the same achievement: winning the next point on defence takes the disc off someone, winning it on offence keeps the disc you already had. Small samples are visibly small: a short rail is a couple of timeouts and no more, which is why nothing on this view is greyed out — every club here is working from a handful of timeouts, so singling some out as short-sampled would imply the rest are not.',
    // No sample gate, deliberately. Everywhere else a threshold separates
    // clubs with enough of something from clubs without, but every timeout
    // sample is small — a side calls three or four in a game — so a cut at
    // five would be dividing small from slightly-less-small and dressing it
    // up as a distinction. The rail already carries the honest version of the
    // warning: its length IS the number of timeouts, so a club with two has a
    // stub and nobody needs telling twice.
    part: (t) => t.timeoutsConverted, whole: (t) => t.timeouts, rate: (t) => t.timeoutConversion,
    min: 0,
    fmt: (t) => (t.timeouts ? pctText(t.timeoutConversion) : '—'),
    sub: (t) => {
      if (!t.timeouts) return 'no timeouts called';
      const split = (t.timeoutsBreak || t.timeoutsHold)
        ? ` · ${t.timeoutsBreak} break${t.timeoutsBreak === 1 ? '' : 's'}, ${t.timeoutsHold} hold${t.timeoutsHold === 1 ? '' : 's'}`
        : '';
      return `scored ${t.timeoutsConverted} of the ${t.timeouts} that followed${split}`;
    } },
];

const pctText = (v) => (v === null || v === undefined ? '—' : `${v}%`);

// Signed: positive means a club takes longer to be scored on than to score.
const dGap = (t) => (t.secondsPerBreak === null || t.secondsPerBreak === undefined
  || t.secondsPerConcededHold === null || t.secondsPerConcededHold === undefined)
  ? null : t.secondsPerConcededHold - t.secondsPerBreak;

// How much of the rail each arm may use, which is also what is left over for
// the centre to travel in. Splitting the width between the two encodings is
// the whole design: neither can have all of it.
const ARM_MAX = 26;

// Where a club's own average defensive point sits against the rest of its
// division, as a percentage across the rail.
//
// This is the second thing each row says. Pace-adjusting the arms deliberately
// threw tempo away — that was right, because it stopped the column ranking
// clubs by how fast they play — but thrown away entirely it left two clubs
// forty seconds apart looking identical. Putting tempo back as the POSITION of
// the centre restores it without letting it contaminate the arms: horizontal
// placement is absolute, arm length is relative to self, and the two never mix.
function centreAt(own, pace) {
  if (!pace || !Number.isFinite(own) || pace.hi === pace.lo) return 50;
  const t = (own - pace.lo) / (pace.hi - pace.lo);
  return ARM_MAX + Math.min(Math.max(t, 0), 1) * (100 - 2 * ARM_MAX);
}

// The two arms, both measured from the club's own average defensive point.
// `span` is shared by every row in the block so lengths compare down it, and
// is recomputed per division for the same reason the rails are.
//
// The arms always land on opposite sides, and that is arithmetic rather than
// luck: the centre is the count-weighted mean of the very two numbers being
// drawn, so it necessarily sits between them. A row can never show both bars
// the same way, which is what keeps the column scannable — the eye reads one
// shape flipping over, not two independent lengths.
function shapeRail(t, span, pace) {
  const own = t.dSecsPerPoint;
  if (own === null || own === undefined || dGap(t) === null) {
    return '<span class="rl-shape"></span>';
  }
  const mid = centreAt(own, pace);
  const arm = (v) => {
    const dev = v - own;
    const w = Math.min(Math.abs(dev) / span, 1) * ARM_MAX;
    return `left:${dev < 0 ? mid - w : mid}%;width:${Math.max(w, 1.2)}%`;
  };
  // The faint tick is the division's median club, so a centre can be read as
  // fast or slow without counting along the axis.
  const guide = pace && Number.isFinite(pace.median)
    ? `<u style="left:${centreAt(pace.median, pace)}%"></u>` : '';
  return `<span class="rl-shape">${guide}<s style="left:${mid}%"></s>` +
    `<i class="b" style="${arm(t.secondsPerBreak)}"></i>` +
    `<i class="c" style="${arm(t.secondsPerConcededHold)}"></i></span>`;
}

// Which slice of star reliance is on screen. The payload carries all three so
// switching between them costs no request.
const EMPTY_REL = { rate: null, part: 0, whole: 0, contributors: 0, names: [] };
const relKey = () => S.relianceKey || 'total';
const rel = (t) => (t.reliance && t.reliance[relKey()]) || EMPTY_REL;
const RELIANCE_VERB = {
  goals: 'have scored', assists: 'have assisted', total: 'have a goal or an assist',
};

// "Groom 12, Rippe 9, Lien 8 · 20 others have scored".
//
// The count is the TAIL, not the total. It used to read "23 have scored" next
// to three named players, which invited exactly the wrong subtraction — the
// interesting figure is how many people are not in the top three.
function relianceSub(t) {
  const r = rel(t);
  const verb = RELIANCE_VERB[relKey()];
  const unit = relKey() === 'assists' ? 'A' : relKey() === 'goals' ? 'G' : '';
  const others = Math.max(0, r.contributors - r.names.length);
  const tail = others === 0
    ? `nobody else ${verb === 'have scored' ? 'has scored' : verb === 'have assisted' ? 'has assisted' : 'has contributed'}`
    : `${others} other${others === 1 ? '' : 's'} ${verb}`;
  if (!r.names.length) return `${r.contributors} ${verb}`;
  return `${r.names.map((x) => `${x.name} ${x.n}${unit}`).join(', ')} · ${tail}`;
}
function clock(seconds) {
  const s = Math.max(0, Math.round(seconds || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m`;
}

async function renderStats() {
  if (!S.stats || S.statsDiv !== (S.statDivision || '')) {
    const q = S.statDivision ? `?division=${encodeURIComponent(S.statDivision)}` : '';
    S.stats = await api('/stats' + q);
    S.statsDiv = S.statDivision || '';
  }
  const d = S.stats;
  const view = STAT_VIEWS.find((v) => v.key === (S.statView || 'breaks')) || STAT_VIEWS[0];

  if (!d.coverage.points) {
    return `<div class="empty">No point-by-point data yet.<br>
      <span style="font-size:12px">It arrives a few minutes after each game finishes.</span></div>`;
  }

  const divs = [['', 'All divisions'], ['Open', 'Open'], ["Women's", "Women's"], ['Mixed', 'Mixed']];
  const divBar = `<div class="stat-tabs">${divs.map(([k, l]) =>
    `<button class="${(S.statDivision || '') === k ? 'on' : ''}"
       onclick="S.statDivision='${k.replace(/'/g, "\\'")}';S.stats=null;render()">${l}</button>`).join('')}</div>`;

  const viewBar = `<div class="stat-tabs">${STAT_VIEWS.map((v) =>
    `<button class="${v.key === view.key ? 'on' : ''}"
       onclick="S.statView='${v.key}';render()">${v.label}</button>`).join('')}</div>`;

  // Only the views that split three ways get a second row of buttons.
  const keyBar = view.keys
    ? `<div class="stat-tabs">${view.keys.map(([k, l]) =>
        `<button class="${relKey() === k ? 'on' : ''}"
           onclick="S.relianceKey='${k}';render()">${l}</button>`).join('')}</div>`
    : '';

  // Connections is not a team table, so it leaves the machinery below alone
  // and renders its own body.
  if (view.combos) {
    return divBar + viewBar +
      (d.combos && d.combos.length
        ? comboBlock(d.combos, S.statDivision, ' ', 30)
        : `<div class="empty">No pair has connected twice yet.</div>`) +
      `<div class="mnote">${esc(view.note)}</div>`;
  }

  const c = d.coverage;
  const dropped = Math.max(0, c.points - c.anchoredPoints);
  const cov = `<div class="cov">
    <b>${c.points.toLocaleString()}</b> points across <b>${c.ingestedGames}</b> games, every one
    played so far.${dropped ? ` <b>${dropped}</b> of them had no recorded opening offence, so who
      was on which line can't be known — those are dropped from breaks, holds and O/D time.
      Their goals and assists still count.` : ''}
  </div>`;

  // Divisions never play each other, so a single ranked list of all 136 clubs
  // silently compares teams with no common opponents. Each block is also
  // scaled to its own busiest club, which is why they can't be read across.
  const body = S.statDivision
    ? statTable(sortForView(d.teams, view), view, null)
    : ['Open', "Women's", 'Mixed'].map((div) => {
        const rows = sortForView(d.teams.filter((t) => t.division === div), view);
        if (!rows.length) return '';
        return statTable(rows.slice(0, 10), view, div, rows.length);
      }).join('');

  const dNote = view.shape
    ? `<div class="mnote">Tournament-wide the median club takes <b>212s</b> to break and
       <b>172s</b> to concede, so breaking is the <i>slower</i> of the two and only 9 clubs in 47
       concede more slowly than they break — a break needs a turnover and usually several
       exchanges, while being held can be four passes. That is why a positive gap is the unusual
       one. Each row says two things at once: WHERE the chalk mark sits is how long this club's
       defensive points run against the rest of the division, left for quick and right for slow,
       with the faint tick marking the median club. HOW FAR the bars reach from it is the split
       between the two outcomes, measured against the club itself. Position is absolute, length is
       relative, and keeping them apart is what stops tempo leaking into the comparison. Both
       scales are per division block, so nothing compares across two.</div>`
    : '';
  const shapeKey = view.shape
    ? `<div class="shapekey">
         <span><i style="background:var(--brk)"></i>their breaks</span>
         <span><i style="background:var(--con)"></i>their concessions</span>
         <span><i style="background:var(--chalk);border-radius:0;width:2px;height:10px"></i>their
           own average D point &mdash; further right means longer</span>
         <span><i style="background:var(--dim);border-radius:0;width:1px;height:10px"></i>the
           division's median club</span>
       </div>`
    : '';
  const scaleNote = (view.plain || view.shape) ? ''
    : `<div class="mnote">Rails are scaled within each division, to the club with the most
       ${esc(view.label.toLowerCase() === 'breaks' ? 'defensive points' : 'of them')} — so lengths
       compare down a block, never across two.</div>`;

  return divBar + viewBar + keyBar + shapeKey + cov + body +
    `<div class="mnote">${esc(view.note)}</div>` + dNote + scaleNote;
}

// Sorting. Clubs with barely any data sink rather than topping the table on a
// 100% rate from four points. Ties break on volume: two clubs on 66.7% are not
// equally convincing when one has done it 20 times and the other 10.
// Enough of a sample for THIS stat, which is not the same question as whether
// the club has played much. Fury's fourteen defensive points make a fine break
// rate and their single offensive point makes a meaningless hold rate.
function enough(view, t) {
  return (view.whole(t) || 0) >= (view.min || 0);
}

function sortForView(teams, view) {
  const val = (t) => (view.plain ? view.value(t) : (view.rate(t) ?? -1));
  const vol = (t) => view.whole(t) || 0;
  return teams.slice().sort((a, b) => {
    const ea = enough(view, a), eb = enough(view, b);
    if (ea !== eb) return ea ? -1 : 1;
    const d = view.lowerIsBetter ? val(a) - val(b) : val(b) - val(a);
    return d !== 0 ? d : vol(b) - vol(a);
  });
}

function statTable(rows, view, division, totalInDivision) {
  const head = division
    ? `<button class="dayhead" onclick="S.statDivision='${division.replace(/'/g, "\\'")}';S.stats=null;render()">
         <span class="dh-l">${esc(division)}</span>
         <span class="dh-n">${totalInDivision} clubs</span>
         <span class="dh-c">›</span></button>`
    : '';

  // Par: the pooled rate across everything in view. Drawn on each rail at the
  // point its fill would reach if the club performed exactly at that rate, so
  // "past the tick" means above average whatever the club's volume.
  const totPart = view.plain ? 0 : rows.reduce((n, t) => n + (view.part(t) || 0), 0);
  const totWhole = view.plain ? 0 : rows.reduce((n, t) => n + (view.whole(t) || 0), 0);
  const par = totWhole > 0 ? totPart / totWhole : 0;
  const maxWhole = view.plain ? 0 : Math.max(1, ...rows.map((t) => view.whole(t) || 0));
  // Two scales for the block, one per encoding: how long an arm may get, and
  // where a centre may sit. Both are per-division, like every other rail here.
  let shapeSpan = null, shapePace = null;
  if (view.shape) {
    const usable = rows.filter((t) => enough(view, t) && dGap(t) !== null
      && Number.isFinite(t.dSecsPerPoint));
    const devs = usable.flatMap((t) => [Math.abs(t.secondsPerBreak - t.dSecsPerPoint),
                                        Math.abs(t.secondsPerConcededHold - t.dSecsPerPoint)]);
    shapeSpan = Math.max(20, ...devs) * 1.15;
    const paces = usable.map((t) => t.dSecsPerPoint).sort((a, b) => a - b);
    if (paces.length) {
      const m = paces.length >> 1;
      shapePace = {
        lo: paces[0], hi: paces[paces.length - 1],
        median: paces.length % 2 ? paces[m] : (paces[m - 1] + paces[m]) / 2,
      };
    }
  }

  let parPlain = null;
  if (view.plain) {
    const vals = rows.filter((t) => enough(view, t))
      .map((t) => view.value(t)).filter((v) => Number.isFinite(v));
    parPlain = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  }

  return head + `<div class="rail-card">${rows.map((t, i) => {
    const whole = view.plain ? 0 : (view.whole(t) || 0);
    const part = view.plain ? 0 : (view.part(t) || 0);
    // "Good" is not always "more". On time-on-offence and on pace, a smaller
    // number is the better one, so the green has to follow the meaning of the
    // stat rather than the direction of the bar.
    const good = view.neutral ? false : view.plain
      ? (parPlain !== null && (view.value(t) <= parPlain) === true && enough(view, t))
      : (whole > 0 && (view.lowerIsBetter ? part / whole <= par : part / whole >= par));
    return `<div class="rl ${enough(view, t) ? '' : 'thin'}">
      <span class="rl-rk">${i + 1}</span>
      <span class="rl-main">
        <span class="rl-name">${teamLink({ id: t.teamId, name: t.name })}
          <span class="ctry">${esc(t.country || '')}</span></span>
        ${view.shape ? shapeRail(t, shapeSpan, shapePace) : view.plain ? '' : `<span class="rl-rail">
          <i class="rl-w" style="width:${(whole / maxWhole) * 100}%"></i>
          <i class="rl-p ${view.neutral ? 'neutral' : (good ? '' : 'under')}"
             style="width:${(part / maxWhole) * 100}%"></i>
          <s class="rl-par" style="left:${((whole * par) / maxWhole) * 100}%"></s>
        </span>`}
        <span class="rl-sub">${esc(view.sub(t))} · ${t.games} game${t.games === 1 ? '' : 's'}</span>
      </span>
      <span class="rl-val ${good ? 'up' : ''}">${view.fmt(t)}</span>
    </div>`;
  }).join('')}</div>`;
}

// Who actually throws to whom. Both ends of every goal are in the feed, so
// these pairs have always been there — they only become visible once a whole
// tournament is pooled, which is why they aren't published anywhere.
function comboBlock(combos, division, title, limit = 10) {
  if (!combos || !combos.length) return '';
  const scope = title ? '' : (division ? ` · ${division}` : ' · all divisions');
  return `<div class="day">${esc(title || 'Best connections')}${scope}</div>
    <div class="lb">${combos.slice(0, limit).map((c, i) => `<div class="r">
      <span class="rk">${i + 1}</span>
      <span class="nm">${esc(c.assistName || 'Unknown')}<span class="arw"> → </span>${
        esc(c.scorerName || 'Unknown')}
        <div class="sub">${esc(c.team || '')}</div></span>
      <span class="v">${c.goals}<span style="font-size:10px;color:var(--dim)"> G</span></span>
    </div>`).join('')}</div>` +
    (title ? '' : `<div class="mnote">Pairs who have connected for at least two goals, thrower
      first. A partnership is not a fact about any single game, so this is the one number here
      that could not exist before the tournament was pooled.</div>`);
}

// --- club profile ------------------------------------------------------------
//
// Deliberately not another leaderboard. A ranked table shows one stat across
// many clubs; this shows many stats for one club, which is a different question
// and the one you actually ask when a name catches your eye.
//
// Every row is drawn against its division instead of in the abstract: the chalk
// tick is the division median and the bar runs from there to where this club
// sits. The eye reads the gap rather than the level, so you don't need to
// already know what a good hold rate looks like in the Women's division to see
// that a side is well past it. Divisions are benchmarked separately because
// they never play each other.
const fmtStat = (v, unit) => (v === null || v === undefined ? '—' : `${v}${unit}`);
const ordinal = (v) => {
  const s = ['th', 'st', 'nd', 'rd'], m = v % 100;
  return v + (s[(m - 20) % 10] || s[m] || s[0]);
};
// Neutral stats have no good end, so they are never coloured as if they did.
const betterThanMedian = (c) => !c.thin && !c.neutral && c.median !== null
  && (c.lowerIsBetter ? c.value < c.median : c.value > c.median);

function devBar(c) {
  if (c.thin || c.value === null || c.median === null) return '<span class="dev"></span>';
  // Scale to the division's own p10-p90, widened if this club sits outside it.
  const lo = Math.min(c.p10 ?? c.value, c.value, c.median);
  const hi = Math.max(c.p90 ?? c.value, c.value, c.median);
  const span = hi - lo;
  const at = (x) => (span > 0 ? ((x - lo) / span) * 100 : 50);
  const pos = at(c.value), med = at(c.median);
  const left = Math.min(pos, med);
  const width = Math.min(Math.max(Math.abs(pos - med), 2), 100 - left);
  const cls = c.neutral ? 'neutral' : (betterThanMedian(c) ? 'good' : '');
  return `<span class="dev"><i class="${cls}" style="left:${left}%;width:${width}%"></i>` +
         `<s style="left:${med}%"></s></span>`;
}

function squadBlock(squad) {
  if (!squad || !squad.length) return '';
  return `<div class="day">Squad · goals and assists</div>
    <div class="lb">${squad.slice(0, 12).map((x, i) => `<div class="r">
      <span class="rk">${i + 1}</span>
      <span class="nm">${esc(x.name || 'Unknown')}
        <div class="sub">${x.goals}G · ${x.assists}A</div></span>
      <span class="v">${x.total}<span style="font-size:10px;color:var(--dim)"> G+A</span></span>
    </div>`).join('')}</div>`;
}

// A club's defensive points measured against ITSELF instead of the field.
//
// Across all 55 clubs both halves are dominated by how long that club's points
// run in general (r = +0.65 and +0.76 against its own average defensive
// point), so a chart on raw seconds mostly ranks clubs by tempo. Subtracting
// each club's own average cancels that and leaves the asymmetry. What it still
// cannot say is whether the defence is good — neither half predicts break rate
// — so there is no green here, and the note says why.
function dShapeBlock(d, name) {
  if (!d) return '';
  if (d.thin) {
    return `<div class="dsh">
      <div class="dh">Shape of a defensive point</div>
      <div class="dc">Needs ${d.minSample} breaks and ${d.minSample} points conceded on a usable
        clock before the two are worth putting side by side. ${esc(name)} have ${d.breakN}
        and ${d.concedeN}.</div></div>`;
  }
  const span = Math.max(Math.abs(d.toBreak - d.own), Math.abs(d.toConcede - d.own), 20) * 1.3;
  const arm = (v) => {
    const dev = v - d.own;
    const w = Math.min(Math.abs(dev) / span, 1) * 50;
    return `left:${dev < 0 ? 50 - w : 50}%;width:${Math.max(w, 1.2)}%`;
  };
  const sign = (v) => `${v > 0 ? '+' : ''}${Math.round(v)}s`;
  const g = d.gap;
  // Both the club and the division median, because "+79s" means nothing until
  // you know a typical club here runs the other way.
  const versus = (d.divisionMedianGap === null || d.divisionMedianGap === undefined)
    ? 'No other club in the division has enough of both to compare against yet.'
    : `The median club in their division sits at ${sign(d.divisionMedianGap)}, across
       ${d.divisionClubsCompared} clubs with enough of both.`;
  return `<div class="dsh">
    <div class="dh">Shape of a defensive point</div>
    <div class="dc">Centred on ${esc(name)}'s own average defensive point, ${d.own}s, so their
      general tempo drops out and only the difference between the two outcomes is left.</div>
    <div class="dbar"><span class="dax"></span>
      <i class="b" style="${arm(d.toBreak)}"></i>
      <i class="c" style="${arm(d.toConcede)}"></i></div>
    <div class="dends"><span>← quicker than their own normal</span><span>slower →</span></div>
    <div class="dkey">
      <span><i style="background:var(--brk)"></i>${d.toBreak}s to break</span>
      <span><i style="background:var(--con)"></i>${d.toConcede}s to concede</span>
      <b>${sign(g)}</b></div>
    <div class="mnote" style="margin:11px 0 0">${g > 0
      ? 'Their concessions run longer than their breaks'
      : 'Their breaks run longer than their concessions'} by
      ${Math.abs(Math.round(g))} seconds. ${versus} This describes the defence rather than
      grading it: across the tournament neither of these times predicts how often a club
      actually breaks.</div>
  </div>`;
}

// Where "back" goes. A profile used to be reachable only from the stats table;
// it is now reachable from four lists, and dropping someone into a table they
// were never looking at is a worse answer than remembering where they came in.
const CAME_FROM = { stats: 'All clubs', rankings: 'Rankings', results: 'Results',
  board: 'Upcoming', live: 'Live' };

function openTeam(id) {
  if (!id) return;
  if (S.tab !== 'team') S.teamFrom = S.tab;
  S.teamId = id; S.tab = 'team'; renderChrome(); render();
}

async function renderTeam() {
  const p = await api('/team?id=' + encodeURIComponent(S.teamId));
  const t = p.team, st = p.stats;

  const from = CAME_FROM[S.teamFrom] ? S.teamFrom : 'stats';
  const back = `<button class="dayhead" onclick="go('${from}')">
      <span class="dh-c">‹</span><span class="dh-l">${esc(CAME_FROM[from])}</span></button>`;

  const head = `<div class="pfhead">
    <div class="pfn">${esc(t.name)}</div>
    <div class="pfm">${[t.country, t.division, t.seed ? `seed ${t.seed}` : null]
      .filter(Boolean).map(esc).join(' · ')}</div>${st ? `
    <div class="pfs">${st.holds + st.breaks} points scored of ${st.pointsPlayed} played, across
      ${st.games} game${st.games === 1 ? '' : 's'}.${st.gamesUntraced
        ? ` ${st.gamesUntraced} of them ${st.gamesUntraced === 1 ? 'is' : 'are'} missing the
            opening offence, which costs a point or two off the breaks and holds below —
            the rest of ${st.gamesUntraced === 1 ? 'that game' : 'those games'} counts normally.`
        : ''}
    </div>` : ''}
  </div>`;

  // A club with no traceable points is a different thing from a club with none
  // of its stats above the gate, and the page should not conflate them.
  if (!st) {
    return back + head + `<div class="empty">Nothing traceable for this club yet.<br>
      <span style="font-size:12px">Point-by-point data arrives a few minutes after
      each game finishes.</span></div>`;
  }

  const rows = p.context.map((c) => `<div class="pr ${c.thin ? 'thin' : ''}">
    <span class="pl"><b>${esc(c.label)}</b><u>${
      c.thin ? 'not enough of it yet'
        : c.median === null ? 'no division benchmark'
        : `division median ${fmtStat(c.median, c.unit)}${
            c.rank ? ` · ${ordinal(c.rank)} of ${c.of}` : ''}`}</u></span>
    ${devBar(c)}
    <span class="pv ${betterThanMedian(c) ? 'up' : ''}">${
      c.thin ? '—' : fmtStat(c.value, c.unit)}</span>
  </div>`).join('');

  return back + head + `<div class="pf">${rows}</div>
    <div class="mnote">The chalk mark on each bar is the median club in
      ${esc(t.division)}; the bar runs from there to where ${esc(t.name)} sit, so length is the
      gap and not the level. Rows in grey are below the sample that particular stat needs — which
      is a question about the stat, not about the club. A side can have a meaningful break rate
      and a meaningless hold rate at the same time, and usually does early on.</div>` +
    dShapeBlock(p.dShape, t.name) +
    squadBlock(p.squad) +
    comboBlock(p.combos, null, 'Connections');
}

// --- results ----------------------------------------------------------------
//
// The mirror of the board. Same day-by-day shape, because the question is the
// same one asked backwards — the board is "what is still to come", this is
// "what did I miss" — and a reader who has learned one list should not have to
// learn the other.
//
// Unlike the board, only one day is open at a time. /results serves a day per
// request and the newest one is what almost everybody wants; letting several
// stack open would mean holding days in memory to answer a question nobody is
// asking.
async function loadResults(day) {
  const d = await api('/results' + (day ? '?day=' + encodeURIComponent(day) : ''));
  S.resDays = d.days || [];
  // Whatever we asked for, the server decides which day it actually served —
  // on the first visit we ask for nothing and it picks the newest.
  S.resDay = d.day;
  S.resGames = d.games || [];
  S.resLoaded = true;
}

function pickResultDay(day) {
  if (day === S.resDay) return;
  S.resDay = day; S.resLoaded = false;
  render();
}

async function renderResults() {
  // The day is null until the server has picked one, so "have we fetched yet"
  // cannot be inferred from it and needs a flag of its own.
  if (!S.resLoaded) await loadResults(S.resDay);

  let html = divisionChips(S.resDiv, 'resDiv');
  if (!S.resDays.length) {
    return html + `<div class="empty">Nothing has finished yet.<br>
      <span style="font-size:12px">Scores land here within a few minutes of the last point.</span></div>`;
  }

  for (const d of S.resDays) {
    const on = d.day === S.resDay;
    html += `<button class="dayhead ${on ? 'on' : ''}" onclick="pickResultDay('${d.day}')">
      <span class="dh-l">${dayLabel(d.day)}</span>
      <span class="dh-n">${d.games} game${d.games === 1 ? '' : 's'}</span>
      <span class="dh-c">${on ? '&minus;' : '+'}</span>
    </button>`;
    if (!on) continue;
    // Filtered in the browser rather than by /results?division=, so switching
    // divisions costs no request and the counts in the headers keep meaning
    // "games that day" instead of quietly changing meaning under the chips.
    // Same trade the board already makes.
    const shown = S.resDiv ? S.resGames.filter((g) => g.division === S.resDiv) : S.resGames;
    if (!shown.length) {
      html += `<div class="empty" style="padding:20px">${S.resDiv
        ? `Nothing in ${esc(S.resDiv)} on this day.` : 'Nothing on this day.'}</div>`;
      continue;
    }
    for (const g of shown) html += resultCard(g);
  }
  return html;
}

function resultCard(g) {
  // A voided game has a score in the database and that score means nothing, so
  // it is dimmed and labelled rather than shown as if it were a result. A
  // forfeit is the opposite case: the result stands, it just wasn't played.
  const home = g.score.home, away = g.score.away;
  return `<div class="game"${g.voided ? ' style="opacity:.6"' : ''}>
    <div class="meta">
      <span class="pill">${esc(g.division || '')}</span>
      ${g.pool ? `<span>${esc(g.pool)}</span>` : ''}
      ${g.voided ? `<span class="pill" style="color:var(--down)">VOID</span>` : ''}
      ${g.forfeit ? `<span class="pill" style="color:var(--down)">FORFEIT</span>` : ''}
      <span class="t">${fmtTime(g.startsAt)}</span>
    </div>
    <div class="livescore">
      <span class="ls-n">${teamLink(g.home)}
        <div class="sub">${esc(g.home.country || '')}${g.home.seed ? ' · #' + g.home.seed : ''}</div></span>
      <span class="ls-s"${g.voided ? ' style="color:var(--dim)"' : ''}>${
        home}<span class="ls-d">–</span>${away}</span>
      <span class="ls-n" style="text-align:right">${teamLink(g.away)}
        <div class="sub">${esc(g.away.country || '')}${g.away.seed ? ' · #' + g.away.seed : ''}</div></span>
    </div>
    ${g.voided ? `<div class="spnote">Voided${g.voidReason ? ` — ${esc(g.voidReason)}` : ''}.
      The score above does not stand.</div>` : ''}
    ${g.forfeit && !g.voided ? `<div class="spnote">Awarded by forfeit.</div>` : ''}
  </div>`;
}

// --- rankings ---------------------------------------------------------------
//
// The model's own order, which is not the seeding, and the gap between the two
// is the only thing on this page you could not have read off a draw sheet.
async function renderRankings() {
  // The division is always a string, so null is a sentinel it can never match
  // and the first render always fetches. Results needs a separate flag because
  // its key is a day, and the day genuinely is null until the server picks one.
  if (S.rankKey !== S.rankDiv) {
    const q = S.rankDiv ? '?division=' + encodeURIComponent(S.rankDiv) : '';
    S.ranks = (await api('/rankings' + q)).teams || [];
    S.rankKey = S.rankDiv;
  }

  let html = divisionChips(S.rankDiv, 'rankDiv');
  if (!S.ranks.length) return html + `<div class="empty">No clubs to rank yet.</div>`;

  // Divisions never play each other, so one list of every club would put teams
  // with no common opponents in the same column. Same reason the stats tables
  // block by division.
  html += S.rankDiv
    ? rankTable(S.ranks)
    : ['Open', "Women's", 'Mixed'].map((div) => {
        const rows = S.ranks.filter((t) => t.division === div);
        if (!rows.length) return '';
        return `<button class="dayhead" onclick="S.rankDiv='${div.replace(/'/g, "\\'")}';render()">
            <span class="dh-l">${esc(div)}</span>
            <span class="dh-n">${rows.length} clubs</span>
            <span class="dh-c">›</span></button>` + rankTable(rows.slice(0, 12));
      }).join('');

  return html + `<div class="mnote">The rating is Glicko. Every club starts from its WFDF seed
    and moves on every result — beating a club the model rates above you is worth more than
    beating one below. <b>rd</b> is how unsure the model still is: it starts wide and narrows
    with each game, so a club it has barely seen has a rating that is still mostly the seed it
    was handed. Those rows are greyed and marked provisional, because they are not really
    ranked yet — the position is the seeder's opinion, not the model's.</div>`;
}

function rankTable(rows) {
  return `<div class="rail-card">${rows.map((t) => `<div class="rl ${t.provisional ? 'thin' : ''}">
    <span class="rl-rk">${t.position}</span>
    <span class="rl-main">
      <span class="rl-name">${teamLink({ id: t.teamId, name: t.name })}
        <span class="ctry">${esc(t.country || '')}</span></span>
      <span class="rl-sub">${seedLine(t)}</span>
    </span>
    <span class="rl-val">${t.rating}</span>
  </div>`).join('')}</div>`;
}

// The seed comparison, which is the interesting column. Movement is coloured
// up/down — not as praise, but because "the tournament has disagreed with the
// seeding in your favour" is genuinely the good direction to be moving, and an
// unsigned number here reads as noise.
function seedLine(t) {
  const played = `${t.played} game${t.played === 1 ? '' : 's'}`;
  if (t.provisional) {
    return `${t.seed ? `seed ${t.seed} · ` : ''}${played} · provisional, ±${t.rd}`;
  }
  if (!t.seed) return `unseeded · ${ordinal(t.position)} · ${played}`;
  const d = t.seedDelta;
  // Kept short because .rl-sub is one ellipsised line and the games count, on
  // the right of it, is what falls off the end when the wording runs long.
  const move = d > 0 ? `<span style="color:var(--up)">up ${d}</span>`
    : d < 0 ? `<span style="color:var(--down)">down ${-d}</span>`
    : 'as seeded';
  return `seed ${t.seed} &rarr; ${ordinal(t.position)} · ${move} · ${played}`;
}

// --- live -------------------------------------------------------------------
async function loadLive() {
  const d = await api('/live');
  S.live = d.games || [];
  S.liveCount = S.live.length;
}

function renderLive() {
  if (S.query) return renderSearch();
  if (!S.live?.length) {
    return searchBar() + `<div class="empty">Nothing in progress.<br>
      <span style="font-size:12px">Games move here from Upcoming the moment they start.</span>
      <div style="margin-top:16px"><button class="btn ghost" onclick="go('board')">
        See upcoming games</button></div></div>`;
  }
  return searchBar() + `<div class="livenote"><strong>These games have already started.</strong>
    The percentages are the model's, recalculated from the score and how much of the game
    is left, so they swing hard late in a close one. Scores reach us a few seconds after
    they reach whoever is pitch-side.</div>` +
    S.live.map(liveCard).join('');
}

function liveCard(g) {
  // Decided beats suspended: once the score is at the target the game is over,
  // whatever the feed is still doing between points.
  const state = g.decided ? 'FINAL' : g.suspendedFor > 0 ? `PAUSED ${g.suspendedFor}s` : 'LIVE';
  return `<div class="game live"${g.decided ? ' style="opacity:.72"' : ''}>
    <div class="meta">
      <span class="pill">${esc(g.division || '')}</span>
      ${g.pool ? `<span>${esc(g.pool)}</span>` : ''}
      ${g.capped && !g.decided
        ? `<span class="pill" style="color:var(--down)">CAP · to ${g.target}</span>` : ''}
      <span class="t" style="color:${g.decided ? 'var(--dim)'
        : g.suspendedFor > 0 ? 'var(--down)' : 'var(--up)'}">${state}</span>
    </div>
    <div class="livescore">
      <!-- Plain text, not a link: each club is already named again in the panel
           below, and two dotted underlines on the same word in one card reads as
           two different destinations. One tap target per club per card. -->
      <span class="ls-n">${esc(g.home.name)}</span>
      <span class="ls-s">${g.score.home}<span class="ls-d">–</span>${g.score.away}</span>
      <span class="ls-n" style="text-align:right">${esc(g.away.name)}</span>
    </div>
    <div class="winbar"><span style="width:${Math.round(g.home.prob * 100)}%"></span></div>
    <div class="winpct">
      <span>${winPct(g.home.prob)}</span>
      <span>${winPct(g.away.prob)}</span>
    </div>
    <div class="sides" style="margin-top:9px">
      ${sidePanel(g, 'home')}${sidePanel(g, 'away')}
    </div>
    ${g.decided ? `<div style="font-size:11px;color:var(--dim);margin:7px 4px 0">
      Result stands — waiting on the official confirmation.</div>` : ''}
  </div>`;
}

// --- admin -----------------------------------------------------------------
async function renderAdmin() {
  const d = await api('/admin/games');
  let html = `<div class="tabs"><button class="on" onclick="runSync()">Sync feed now</button></div>`;
  if (!d.games.length) return html + `<div class="empty">Nothing waiting to be settled.</div>`;
  html += d.games.map(g => `<div class="adm">
    <div style="font-size:13.5px;font-weight:600">${esc(g.home_name || g.home_label || '?')}
      <span style="color:var(--dim)">v</span> ${esc(g.away_name || g.away_label || '?')}</div>
    <div class="sub" style="margin-top:3px">${esc(g.division || '')} · ${esc(g.pool_name || '')}
      · ${fmtIrish(g.starts_at)} Limerick</div>
    ${g.needs_review ? `<div style="color:var(--down);font-size:11.5px;margin-top:5px;font-weight:600">
      ⚑ ${esc(g.needs_review)}</div>` : ''}
    <div class="in">
      <input id="h${g.id}" type="number" inputmode="numeric" placeholder="15" value="${g.home_score ?? ''}">
      <span style="color:var(--dim)">–</span>
      <input id="a${g.id}" type="number" inputmode="numeric" placeholder="12" value="${g.away_score ?? ''}">
      <button class="btn" onclick="settle(${g.id})">Settle</button>
      <button class="btn ghost" onclick="voidGame(${g.id})">Void</button>
    </div></div>`).join('');
  return html;
}

async function settle(id) {
  const homeScore = +$('#h' + id).value, awayScore = +$('#a' + id).value;
  if (!homeScore && !awayScore) return toast('Enter the score first.');
  try {
    await api('/admin/settle', { body: { gameId: id, homeScore, awayScore } });
    toast('Settled.'); render();
  } catch (e) { toast(e.message); }
}

async function voidGame(id) {
  const reason = prompt('Why is this game being voided?', 'Abandoned');
  if (reason === null) return;
  try {
    await api('/admin/void', { body: { gameId: id, reason } });
    toast('Voided.'); render();
  } catch (e) { toast(e.message); }
}

async function runSync() {
  toast('Syncing…');
  try {
    const r = await api('/sync?force=1', { method: 'POST' });
    toast(r.skipped ? 'Already up to date.' : `Synced — ${r.settled} settled.`);
    render();
  } catch (e) { toast(e.message); }
}

// --- auth ------------------------------------------------------------------
// Sign-up is gone: there is no account a visitor could want any more. What is
// left is the one that settles games, so the form asks for a name and a code
// and says nothing about joining.
function openLogin() {
  $('#modal').innerHTML = `<div class="modal">
    <div class="sheet">
      <h2>Sign in</h2>
      <p class="lede">Chalk Line has no public accounts. This is for whoever is keeping the
        scores straight.</p>

      <label>Display name</label>
      <input id="dn" autocomplete="nickname" maxlength="24">

      <label>Recovery code</label>
      <input id="rc" autocomplete="one-time-code" placeholder="heron-cobalt-willow"
        autocapitalize="off" autocorrect="off" spellcheck="false">

      <div class="err hide" id="ae"></div>
      <button class="btn" id="ab" onclick="submitLogin()">Sign in</button>

      <div class="switch"><button onclick="openRecover()">Lost your code?</button></div>
      <div class="note"><button onclick="$('#modal').innerHTML=''" style="color:var(--dim)">Close</button></div>
    </div></div>`;
  setTimeout(() => $('#dn')?.focus(), 60);
}

function openRecover() {
  $('#modal').innerHTML = `<div class="modal"><div class="sheet">
    <h2>Lost your code?</h2>
    <p class="lede">If there is an email on the account, we'll send a new code to it.
      The old code stops working once the new one arrives. If there is no email,
      there's no way back into that account — codes aren't stored anywhere.</p>
    <label>Email</label><input id="rem" type="email" autocomplete="email">
    <div class="err hide" id="ae"></div>
    <button class="btn" id="ab" onclick="submitRecover()">Send me a new code</button>
    <div class="switch"><button onclick="openLogin()">Back to sign in</button></div>
  </div></div>`;
  setTimeout(() => $('#rem')?.focus(), 60);
}

async function submitRecover() {
  const btn = $('#ab'); btn.disabled = true;
  const err = $('#ae'); err.classList.add('hide');
  try {
    const r = await api('/recover', { body: { email: $('#rem').value.trim() } });
    $('.sheet').innerHTML = `<h2>Check your email</h2>
      <p class="lede">${esc(r.message)}</p>
      <button class="btn" onclick="openLogin()">Sign in</button>`;
  } catch (e) {
    err.textContent = e.message; err.classList.remove('hide'); btn.disabled = false;
  }
}

async function submitLogin() {
  const btn = $('#ab'); btn.disabled = true;
  const err = $('#ae'); err.classList.add('hide');
  try {
    const r = await api('/login', { body: {
      displayName: $('#dn').value.trim(), recoveryCode: $('#rc').value.trim() } });
    S.user = r.user;
    $('#modal').innerHTML = '';
    renderChrome(); render();
    toast(`Signed in as ${S.user.displayName}`);
  } catch (e) {
    err.textContent = e.message; err.classList.remove('hide'); btn.disabled = false;
  }
}

// --- render ----------------------------------------------------------------
async function render() {
  const v = $('#view');
  try {
    if (S.tab === 'board') { await loadGames(); v.innerHTML = renderBoard(); tick(); }
    else if (S.tab === 'results') v.innerHTML = await renderResults();
    else if (S.tab === 'rankings') v.innerHTML = await renderRankings();
    else if (S.tab === 'stats') v.innerHTML = await renderStats();
    else if (S.tab === 'team') v.innerHTML = await renderTeam();
    else if (S.tab === 'admin') v.innerHTML = await renderAdmin();
    else if (S.tab === 'live') { await loadLive(); v.innerHTML = renderLive(); }
  } catch (e) {
    v.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

(async function init() {
  try { S.user = (await api('/me')).user; } catch {}

  // Which tab you land on depends on whether anything is actually in play, and
  // /games answers that in the same breath as the fixtures — so the board is
  // fetched before the first paint rather than defaulting to Upcoming and
  // discovering the live games a beat later. A game in progress is the only
  // thing here that won't still be here in an hour, so it wins the landing.
  let boarded = false;
  try { await loadGames(); boarded = true; } catch {}
  S.tab = S.liveCount > 0 ? 'live' : 'board';
  renderChrome();
  if (S.tab === 'board' && boarded) { $('#view').innerHTML = renderBoard(); tick(); }
  else await render();

  // Polling is the thing that scales with the number of people watching, so
  // it only runs while the tab is actually in front of someone. A phone in a
  // pocket at the fields costs nothing.
  const visible = () => document.visibilityState === 'visible';
  setInterval(() => {
    if (visible() && S.tab === 'board' && !S.query) render();
  }, 60000);
  // The live board is only useful if it's actually live; the feed's own cache
  // is ten seconds, so there's nothing to gain by going faster.
  setInterval(async () => {
    if (!visible()) return;
    if (S.tab === 'live' && S.query) return;
    if (S.tab === 'live') { await loadLive(); $('#view').innerHTML = renderLive(); }
    else { try { const d = await api('/live'); S.liveCount = (d.games || []).length; renderChrome(); }
           catch {} }
  }, 12000);
  document.addEventListener('visibilitychange', () => {
    if (visible() && S.tab === 'board') render();
  });
})();
</script>
