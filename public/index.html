<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>Chalk Line — WUCC 2026 play-money betting</title>
<meta name="description" content="Play-money betting on every game at the World Ultimate Club Championships 2026. No real money, no prizes.">
<style>
:root{
  --bg:#0a0c10; --surface:#141820; --surface-2:#1c212b; --line:#262d3a;
  --text:#e9edf3; --muted:#8792a4; --dim:#5c6678;
  --up:#00d47e; --down:#ff4d5e; --accent:#f4f7fb; --chalk:#c8d2e0;
  --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden;
  font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:var(--chalk)}
.hide{display:none !important}

/* ---- chrome ---- */
header{
  position:sticky;top:0;z-index:40;background:rgba(10,12,16,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:900px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:800;letter-spacing:-.02em;font-size:17px;flex-shrink:0}
.brand .mark{width:22px;height:3px;background:var(--chalk);border-radius:2px;display:inline-block;margin-bottom:3px}
.roll{margin-left:auto;text-align:right;line-height:1.15}
.roll .n{font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
.roll .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
nav{display:flex;gap:2px;padding:0 10px 10px;max-width:900px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap
}
nav button.on{background:var(--surface-2);color:var(--text)}
main{max-width:900px;margin:0 auto;padding:14px 12px 120px}

/* ---- cards ---- */
.day{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);
  margin:22px 4px 8px;font-weight:700}
.day:first-child{margin-top:4px}
.dayhead{width:100%;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0 8px;
  font-size:14px;font-weight:700;letter-spacing:-.01em}
.dayhead.on{background:var(--surface-2);border-color:#2f3846}
.dayhead .dh-l{flex:1;text-align:left}
.dayhead .dh-n{font-size:11.5px;font-weight:600;color:var(--dim)}
.dayhead .dh-c{width:16px;text-align:center;color:var(--dim);font-size:16px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 12px;margin-bottom:8px}
.meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--dim);margin-bottom:9px}
.pill{background:var(--surface-2);padding:2px 7px;border-radius:5px;font-weight:600;letter-spacing:.02em}
.meta .t{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:7px}
/* Grid items default to min-width:auto, so a long club name blows the row out
   sideways on a phone. Both the cell and the text block have to be allowed to
   shrink before the ellipsis can do its job. */
.side{background:var(--surface-2);border:1px solid transparent;border-radius:9px;
  padding:9px 10px;display:flex;align-items:center;gap:8px;text-align:left;transition:.12s;
  min-width:0;overflow:hidden}
.side:active{transform:scale(.985)}
.side.sel{border-color:var(--chalk);background:#232a36}
.side .nm{flex:1;min-width:0;overflow:hidden}
.side .n1{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .n2{font-size:10.5px;color:var(--dim);margin-top:1px}
.side .od{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;color:var(--up)}
.empty{text-align:center;color:var(--dim);padding:50px 20px;font-size:14px}
.game.live{border-color:#2b3a44}
.livenote{font-size:11.5px;color:var(--dim);line-height:1.5;margin:0 4px 12px}
.livenote strong{color:var(--muted)}
.livebanner{width:100%;display:flex;align-items:center;gap:9px;margin:0 0 12px;
  padding:11px 13px;border-radius:10px;background:#12211c;border:1px solid #1e3a30}
.livebanner .dot{width:7px;height:7px;border-radius:50%;background:var(--up);flex:none;
  box-shadow:0 0 0 3px rgba(0,212,126,.18)}
.livebanner .lb-t{font-weight:700;font-size:13.5px}
.livebanner .lb-s{margin-left:auto;font-size:11.5px;color:var(--up);font-weight:600}
.livescore{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:2px 0 8px}
.livescore .ls-n{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.livescore .ls-s{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.livescore .ls-d{color:var(--dim);margin:0 3px}
.winbar{height:4px;background:var(--down);border-radius:99px;overflow:hidden}
.winbar span{display:block;height:100%;background:var(--up);transition:width .4s ease}
.winpct{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);
  font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.expand{width:100%;display:flex;align-items:center;justify-content:space-between;
  margin-top:8px;padding:7px 2px 1px;font-size:11.5px;font-weight:600;color:var(--muted)}
.expand .chev{font-size:15px;color:var(--dim);width:18px;text-align:center}
.spreads{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.sprow{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.side.sp{padding:7px 9px;background:#171c25}
.side.sp .n1{font-size:12.5px;font-weight:600}
.side.sp .n2{color:var(--chalk);font-weight:700;font-size:11px}
.side.sp .od{font-size:13.5px}
.spnote{font-size:10.5px;color:var(--dim);line-height:1.45;padding:2px 2px 0}


/* ---- stats ---- */
.stat-tabs{display:flex;gap:6px;margin:0 2px 10px;overflow-x:auto;scrollbar-width:none}
.stat-tabs::-webkit-scrollbar{display:none}
.stat-tabs button{padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;
  color:var(--muted);background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.stat-tabs button.on{background:var(--surface-2);color:var(--text);border-color:#2f3846}
.cov{font-size:11px;color:var(--dim);line-height:1.5;margin:0 4px 12px;padding:9px 11px;
  background:var(--surface);border:1px solid var(--line);border-radius:9px}
.cov b{color:var(--muted);font-weight:700}
.mnote{font-size:11px;color:var(--dim);line-height:1.5;margin:8px 4px 18px}


.rail-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;margin-bottom:14px}
.rl{display:grid;grid-template-columns:18px minmax(0,1fr) 56px;gap:9px;align-items:center;
  padding:10px 12px;border-bottom:1px solid var(--line)}
.rl:last-child{border-bottom:none}
.rl.thin{opacity:.5}
.rl-rk{font-size:11px;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
.rl-main{min-width:0}
.rl-name{display:flex;align-items:baseline;gap:6px;font-size:14px;font-weight:650;min-width:0}
.rl-name .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
.rl-name .ctry{flex:0 1 auto;font-size:11px;font-weight:500;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-rail{position:relative;display:block;height:8px;margin:7px 0 5px}
.rl-w{position:absolute;left:0;top:0;bottom:0;background:#232c39;border-radius:99px}
.rl-p{position:absolute;left:0;top:0;bottom:0;border-radius:99px;
  background:linear-gradient(90deg,#0d7d4c,#00d47e)}
.rl-p.under{background:#48566b}
.rl-p.neutral{background:linear-gradient(90deg,#6b5ea8,#9b8ad6)}
.rl-par{position:absolute;top:-3px;width:2px;height:14px;background:var(--chalk);
  opacity:.7;border-radius:1px;text-decoration:none}
.rl-sub{display:block;font-size:11px;color:var(--dim);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.rl-val{text-align:right;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;color:var(--muted)}
.rl-val.up{color:var(--up)}

/* ---- slip ---- */
#slip{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  box-shadow:0 -14px 34px rgba(0,0,0,.5)}
#slip .top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
#slip .who{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#slip .at{font-weight:800;color:var(--up);font-variant-numeric:tabular-nums}
#slip .row{display:flex;gap:8px;align-items:center}
#slip input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:9px;
  padding:11px 12px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;width:100%}
.btn{background:var(--chalk);color:#0b0e13;font-weight:800;padding:11px 18px;border-radius:9px;font-size:14px}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--surface-2);color:var(--text);font-weight:600}
.quick{display:flex;gap:6px;margin-top:8px}
.quick button{background:var(--surface-2);border-radius:7px;padding:6px 0;flex:1;font-size:12px;
  font-weight:600;color:var(--muted)}
#slip .ret{font-size:11.5px;color:var(--dim);margin-top:8px}
#slip .x{color:var(--dim);font-size:20px;padding:0 4px;line-height:1}

/* ---- tables / lists ---- */
.lb{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.lb .r{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
.lb .r:last-child{border-bottom:none}
.lb .rk{width:22px;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums;font-size:12px}
.lb .nm{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .v{font-weight:700;font-variant-numeric:tabular-nums}
.sub{font-size:11px;color:var(--dim);font-weight:500}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);
  border-radius:99px;padding:10px 14px;font-size:15px}
.search input::placeholder{color:var(--dim)}
.search button{padding:0 14px;border-radius:99px;background:var(--surface);
  border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600}
.teamchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);
  border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;margin:0 6px 6px 0}
.teamchip .s{color:var(--dim);font-weight:500;font-size:11px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:6px 12px;border-radius:99px;background:var(--surface);font-size:12.5px;
  font-weight:600;color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.tabs button.on{background:var(--chalk);color:#0b0e13;border-color:var(--chalk)}
.bet{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:7px}
.bet .h{display:flex;align-items:center;gap:8px;font-size:13px}
.bet .h .s{margin-left:auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.s.won{color:var(--up)} .s.lost{color:var(--down)} .s.open{color:var(--muted)} .s.void{color:var(--dim)}
.bet .d{font-size:11.5px;color:var(--dim);margin-top:5px;font-variant-numeric:tabular-nums}

/* ---- modal ---- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(6,8,11,.86);
  display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:22px;width:100%;max-width:380px;max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:19px;letter-spacing:-.01em}
.sheet p.lede{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.5}
.sheet label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--dim);margin:12px 0 5px;font-weight:700}
.sheet input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:16px}
.sheet .btn{width:100%;margin-top:18px;padding:12px}
.err{color:var(--down);font-size:12.5px;margin-top:10px;line-height:1.4}
.note{color:var(--dim);font-size:11.5px;margin-top:14px;line-height:1.5;text-align:center}
.switch{text-align:center;margin-top:14px;font-size:13px;color:var(--muted)}
.switch button{color:var(--chalk);font-weight:600;text-decoration:underline}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:200;
  background:var(--surface-2);border:1px solid var(--line);padding:10px 16px;border-radius:99px;
  font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5)}
footer{max-width:900px;margin:0 auto;padding:26px 16px 40px;color:var(--dim);font-size:11px;
  line-height:1.6;text-align:center;border-top:1px solid var(--line)}
.adm{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px}
.adm .in{display:flex;gap:6px;margin-top:8px;align-items:center}
.adm input{width:52px;background:var(--bg);border:1px solid var(--line);border-radius:7px;
  padding:8px;text-align:center;font-size:15px;font-weight:700}
.adm .btn{padding:8px 12px;font-size:12.5px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><span class="mark"></span>Chalk&nbsp;Line</div>
    <div class="roll" id="roll"></div>
  </div>
  <nav id="nav"></nav>
</header>

<main id="view"><div class="empty">Loading the board…</div></main>

<footer>
  <strong>Play money only.</strong> Chalk Line is a game. No real money is staked, held, or paid out,
  and there are no prizes. Not affiliated with WFDF or WUCC.<br>
  Results from the official WFDF feed. 18+.
</footer>

<div id="slip" class="hide"></div>
<div id="modal"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const money = n => Math.round(Number(n) || 0).toLocaleString('en-GB');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const S = { user: null, tab: 'board', sel: null, div: 'all',
            lbTab: 'bankroll', open: new Set(), query: '', results: null,
            stats: null, statsDiv: null, statView: 'breaks', statDivision: '',
            days: [], day: null, gamesByDay: {}, openDays: new Set(),
            live: [], liveCount: 0 };

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    method: opts.body ? 'POST' : (opts.method || 'GET'),
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

// --- time: viewer's local clock, Irish event time alongside ----------------
const IRISH = 'Europe/Dublin';
const fmtTime = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const fmtIrish = iso => new Date(iso).toLocaleTimeString('en-IE',
  { hour: '2-digit', minute: '2-digit', timeZone: IRISH });
const dayKey = iso => new Date(iso).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });

// --- chrome ----------------------------------------------------------------
function renderChrome() {
  $('#roll').innerHTML = S.user
    ? `<div class="n">${money(S.user.bankroll)} <span style="font-size:11px;font-weight:600;color:var(--dim)">bucks</span></div>
       <div class="l">${esc(S.user.displayName)} <span style="color:${
         S.user.net >= 0 ? 'var(--up)' : 'var(--down)'};font-weight:700">${
         S.user.net >= 0 ? '+' : '−'}${money(Math.abs(S.user.net || 0))}</span></div>`
    : `<button class="btn" style="padding:7px 14px;font-size:13px" onclick="openAuth('signup')">Join</button>`;

  const tabs = [['board', 'Upcoming']];
  if (S.liveCount) tabs.push(['live', `Live · ${S.liveCount}`]);
  tabs.push(['bets', 'My bets'], ['leaders', 'Leaderboard'], ['stats', 'Stats']);
  if (S.user?.isAdmin) tabs.push(['admin', 'Admin']);
  if (S.user) tabs.push(['account', 'Account'], ['out', 'Sign out']);
  $('#nav').innerHTML = tabs.map(([k, l]) =>
    `<button class="${S.tab === k ? 'on' : ''}" onclick="go('${k}')">${l}</button>`).join('');
}

async function go(tab) {
  if (tab === 'out') {
    await api('/logout', { method: 'POST' });
    S.user = null; S.tab = 'board'; renderChrome(); return render();
  }
  if (tab !== 'board') closeSlip();
  S.tab = tab; renderChrome(); render();
}

// --- board -----------------------------------------------------------------
async function loadGames(day) {
  const d = await api('/games' + (day ? '?day=' + encodeURIComponent(day) : ''));
  if (typeof d.liveNow === 'number') S.liveCount = d.liveNow;
  S.days = d.days || [];
  S.day = d.day;
  S.gamesByDay[d.day] = d.games;
  // Whichever day arrived first is the one open on arrival.
  if (!S.openDays.size && d.day) S.openDays.add(d.day);
}

// The board answers instantly from stored data; refreshing the WFDF feed
// happens in its own request so a slow pull never delays the page. If it
// actually changed something, redraw.
let ticking = false;
let nextTickAt = 0;
async function tick() {
  // The server refuses more than one refresh every three minutes anyway, so
  // asking every render just burns a request per tab. Jittered, so a crowd
  // doesn't arrive in lockstep.
  const now = Date.now();
  if (ticking || now < nextTickAt) return;
  nextTickAt = now + 180000 + Math.floor(Math.random() * 60000);
  ticking = true;
  try {
    const r = await api('/tick');
    if (!r.skipped && (r.settled > 0 || r.games?.created > 0 || r.games?.teamsResolved > 0)) {
      await loadGames();
      if (S.tab === 'board' && !S.sel) $('#view').innerHTML = renderBoard();
    }
  } catch {
    // A failed refresh is invisible on purpose — the board still has data.
  } finally { ticking = false; }
}

function renderBoard() {
  if (S.query) return renderSearch();
  const divs = ['all', 'Open', "Women's", 'Mixed'];
  let html = searchBar();
  if (S.liveCount) {
    html += `<button class="livebanner" onclick="go('live')">
      <span class="dot"></span>
      <span class="lb-t">${S.liveCount} game${S.liveCount === 1 ? '' : 's'} in play</span>
      <span class="lb-s">Bet on the current score &rsaquo;</span>
    </button>`;
  }
  html += `<div class="tabs">${divs.map(d =>
    `<button class="${S.div === d ? 'on' : ''}" onclick="S.div='${d.replace(/'/g, "\\'")}';render()">${d === 'all' ? 'All' : d}</button>`).join('')}</div>`;

  if (!S.days.length) {
    return html + `<div class="empty">No games open for betting right now.<br>
      <span style="font-size:12px">Lines appear as soon as the next round is scheduled.</span></div>`;
  }

  for (const d of S.days) {
    const open = S.openDays.has(d.day);
    const loaded = S.gamesByDay[d.day];
    html += `<button class="dayhead ${open ? 'on' : ''}" onclick="toggleDay('${d.day}')">
      <span class="dh-l">${dayLabel(d.day)}</span>
      <span class="dh-n">${d.games} game${d.games === 1 ? '' : 's'}</span>
      <span class="dh-c">${open ? '&minus;' : '+'}</span>
    </button>`;
    if (!open) continue;
    if (!loaded) { html += `<div class="empty" style="padding:20px">Loading…</div>`; continue; }
    const shown = S.div === 'all' ? loaded : loaded.filter(g => g.division === S.div);
    if (!shown.length) {
      html += `<div class="empty" style="padding:20px">Nothing in ${esc(S.div)} on this day.</div>`;
      continue;
    }
    for (const g of shown) html += gameCard(g);
  }
  return html;
}

// "Today", "Tomorrow", then the weekday — the tournament is short enough that
// nobody thinks in dates.
function dayLabel(iso) {
  const d = new Date(iso + 'T12:00:00Z');
  const today = new Date();
  const diff = Math.round((d - new Date(today.toISOString().slice(0, 10) + 'T12:00:00Z')) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  return d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });
}

async function toggleDay(day) {
  if (S.openDays.has(day)) {
    S.openDays.delete(day);
    $('#view').innerHTML = renderBoard();
    return;
  }
  S.openDays.add(day);
  $('#view').innerHTML = renderBoard();
  if (!S.gamesByDay[day]) {
    // Only the day you opened is fetched, so the whole schedule can be
    // browsed without ever pulling it all down at once.
    try { await loadGames(day); } catch { S.openDays.delete(day); }
    $('#view').innerHTML = renderBoard();
  }
}

// The handicap ladder. Positive line = the home side must win by more than
// that; negative = they can lose by less than it.
function gameCard(g) {
  return `<div class="game">
    <div class="meta">
      <span class="pill">${esc(g.division || '')}</span>
      ${g.pool ? `<span>${esc(g.pool)}</span>` : ''}
      <span class="t">${fmtTime(g.startsAt)} · ${fmtIrish(g.startsAt)} Limerick</span>
    </div>
    <div class="sides">${sideBtn(g, 'home')}${sideBtn(g, 'away')}</div>
    <button class="expand" onclick="toggleSpreads(${g.id},event)">
      <span>Winning margin</span>
      <span class="chev" id="chev${g.id}">${S.open.has(g.id) ? '&minus;' : '+'}</span>
    </button>
    <div id="sp${g.id}" class="${S.open.has(g.id) ? '' : 'hide'}">${spreadRows(g)}</div>
  </div>`;
}

function spreadRows(g) {
  if (!g.spreads?.length) return '';
  return `<div class="spreads">` + g.spreads.map((sp) => {
    const h = sp.line > 0 ? `-${Math.abs(sp.line)}` : `+${Math.abs(sp.line)}`;
    const a = sp.line > 0 ? `+${Math.abs(sp.line)}` : `-${Math.abs(sp.line)}`;
    return `<div class="sprow">
      ${spreadBtn(g, 'home', sp, h)}${spreadBtn(g, 'away', sp, a)}
    </div>`;
  }).join('') + `<div class="spnote">Half points, so every bet wins or loses — no ties.
    These are model-priced and don't move with the money.</div></div>`;
}

function spreadBtn(g, side, sp, label) {
  const t = g[side];
  const on = S.sel && S.sel.gameId === g.id && S.sel.side === side
    && S.sel.market === 'spread' && S.sel.line === sp.line;
  return `<button class="side sp ${on ? 'sel' : ''}"
      onclick="pick(${g.id},'${side}','spread',${sp.line})">
    <span class="nm"><div class="n1">${esc(t.name)}</div>
      <div class="n2">${label}</div></span>
    <span class="od">${sp[side].decimal.toFixed(2)}</span></button>`;
}

function toggleSpreads(id, ev) {
  ev?.stopPropagation();
  if (S.open.has(id)) S.open.delete(id); else S.open.add(id);
  const el = $('#sp' + id), ch = $('#chev' + id);
  if (el) el.classList.toggle('hide', !S.open.has(id));
  if (ch) ch.innerHTML = S.open.has(id) ? '&minus;' : '+';
}

function searchBar() {
  return `<div class="search">
    <input id="q" placeholder="Search a club or country" value="${esc(S.query || '')}"
      autocapitalize="off" autocorrect="off" spellcheck="false"
      oninput="onSearch(this.value)">
    ${S.query ? `<button onclick="clearSearch()">Clear</button>` : ''}
  </div>`;
}

let searchTimer = null;
function onSearch(v) {
  clearTimeout(searchTimer);
  // Debounced: one request when they stop typing, not one per keystroke.
  searchTimer = setTimeout(async () => {
    S.query = v.trim();
    if (S.query.length < 2) { S.results = null; return renderKeepingFocus(); }
    try { S.results = await api('/search?q=' + encodeURIComponent(S.query)); }
    catch { S.results = null; }
    renderKeepingFocus();
  }, 250);
}

// Redraw without stealing the caret out of the search box mid-typing.
function renderKeepingFocus() {
  const el = $('#q');
  const pos = el?.selectionStart;
  $('#view').innerHTML = renderBoard();
  const again = $('#q');
  if (again && el === document.activeElement || S.query) {
    again?.focus();
    if (pos != null) again?.setSelectionRange(pos, pos);
  }
}

function clearSearch() {
  S.query = ''; S.results = null;
  $('#view').innerHTML = renderBoard();
}

function renderSearch() {
  let html = searchBar();
  const r = S.results;
  if (!r) return html + `<div class="empty">Searching…</div>`;
  if (!r.teams.length) {
    return html + `<div class="empty">Nothing matches “${esc(S.query)}”.<br>
      <span style="font-size:12px">Try a club name, a country, or an abbreviation.</span></div>`;
  }

  html += `<div style="margin-bottom:12px">` + r.teams.map(t =>
    `<span class="teamchip">${esc(t.name)}
      <span class="s">${esc(t.division || '')}${t.seed ? ' · #' + t.seed : ''}</span></span>`).join('') + `</div>`;

  if (r.games.length) {
    html += `<div class="day">Fixtures</div>`;
    let day = '';
    for (const g of r.games) {
      const d = dayKey(g.startsAt);
      if (d !== day) { html += `<div class="day">${d}</div>`; day = d; }
      html += gameCard(g);
    }
  } else {
    html += `<div class="empty" style="padding:30px">No games left to bet on.</div>`;
  }

  if (r.results?.length) {
    html += `<div class="day">Played</div><div class="lb">` + r.results.map(g =>
      `<div class="r"><span class="nm">${esc(g.home.name)} v ${esc(g.away.name)}
        <div class="sub">${esc(g.division || '')} · ${esc(g.pool || '')}</div></span>
        <span class="v">${g.home.score ?? ''}–${g.away.score ?? ''}</span></div>`).join('') + `</div>`;
  }
  return html;
}

function sideBtn(g, side) {
  const t = g[side];
  const on = S.sel && S.sel.gameId === g.id && S.sel.side === side;
  return `<button class="side ${on ? 'sel' : ''}" onclick="pick(${g.id},'${side}')">
    <span class="nm"><div class="n1">${esc(t.name)}</div>
      <div class="n2">${esc(t.country || '')}${t.seed ? ' · #' + t.seed : ''}</div></span>
    <span class="od">${t.odds.toFixed(2)}</span></button>`;
}

// --- bet slip --------------------------------------------------------------
function pick(gameId, side, market = 'moneyline', line = null) {
  if (!S.user) return openAuth('signup');
  // Compare as strings: ids have arrived as both numbers and strings
  // depending on the backend, and a silent mismatch here means a tap that
  // does nothing at all.
  // A searched or live fixture isn't on the day board, so look everywhere.
  const pool = [...Object.values(S.gamesByDay || {}).flat(),
                ...((S.results && S.results.games) || []), ...(S.live || [])];
  const g = pool.find(x => String(x.id) === String(gameId));
  if (!g) { toast('That game is no longer open.'); return; }
  const rung = market === 'spread'
    ? (g.spreads || []).find((sp) => sp.line === line) : null;
  if (market === 'spread' && !rung) return;
  const odds = rung ? rung[side].decimal : g[side].odds;
  const label = rung
    ? `${g[side].name} ${(side === 'home' ? line > 0 : line <= 0) ? '−' : '+'}${Math.abs(line)}`
    : g[side].name;
  S.sel = { gameId, side, market, line, name: label, odds, stake: 500 };
  render();
  renderSlip();
}

function renderSlip() {
  const s = S.sel;
  if (!s) return closeSlip();
  $('#slip').classList.remove('hide');
  $('#slip').innerHTML = `
    <div class="top">
      <div class="who">${esc(s.name)}</div>
      <div class="at">${s.odds.toFixed(2)}</div>
      <button class="x" onclick="closeSlip()">&times;</button>
    </div>
    <div class="row">
      <input id="stake" type="number" inputmode="numeric" min="10" value="${s.stake}"
        oninput="S.sel.stake=Math.max(0,+this.value||0);$('#ret').textContent=retText()">
      <button class="btn" id="place" onclick="place()">Place bet</button>
    </div>
    <div class="quick">
      ${[100, 500, 1000, 'Max'].map(v =>
        `<button onclick="setStake('${v}')">${v === 'Max' ? 'Max' : money(v)}</button>`).join('')}
    </div>
    <div class="ret" id="ret">${retText()}</div>`;
}

function retText() {
  const s = S.sel;
  if (!s) return '';
  return `Returns ${money(s.stake * s.odds)} · profit ${money(s.stake * s.odds - s.stake)}`;
}

function setStake(v) {
  S.sel.stake = v === 'Max' ? Math.floor(S.user.bankroll) : Number(v);
  $('#stake').value = S.sel.stake;
  $('#ret').textContent = retText();
}

function closeSlip() { S.sel = null; $('#slip').classList.add('hide'); }

async function place() {
  const s = S.sel;
  if (!s) return;
  $('#place').disabled = true;
  try {
    const r = await api('/bet', { body: {
      gameId: s.gameId, side: s.side, stake: s.stake,
      market: s.market, line: s.line } });
    // Stake leaves the account but nothing has been decided, so profit is
    // unchanged until the bet settles. Only the balance moves here.
    S.user.bankroll = r.bet.bankroll;
    renderChrome();
    toast(`Bet placed — returns ${money(r.bet.toReturn)}`);

    // The slip clears once the bet is down, so what's on screen is always
    // something you haven't bet yet. Betting the same game again is a tap on
    // the board, which reopens the slip at the current price rather than the
    // one you just took.
    //
    // Only the slip closes — the board is deliberately NOT repainted here.
    // Repainting during the tap was what made a second bet feel impossible:
    // every card was destroyed and rebuilt underneath the finger. Odds drift
    // is picked up by the next poll.
    closeSlip();
  } catch (e) {
    toast(e.message);
    const b = $('#place');
    if (b) b.disabled = false;
  }
}

// --- my bets ---------------------------------------------------------------
async function renderBets() {
  const d = await api('/mybets');
  if (!d.bets.length) return `<div class="empty">No bets yet.<br>
    <span style="font-size:12px">Pick a side on the board to get started.</span></div>`;
  const open = d.bets.filter(b => b.status === 'open');
  const done = d.bets.filter(b => b.status !== 'open');
  const section = (title, list) => list.length
    ? `<div class="day">${title}</div>` + list.map(betRow).join('') : '';
  return section('Open', open) + section('Settled', done);
}

function betRow(b) {
  {
    const team = b.side === 'home' ? b.home_name : b.away_name;
    const pick = b.market === 'spread'
      ? `${team} ${(b.side === 'home' ? b.line > 0 : b.line <= 0) ? '−' : '+'}${Math.abs(b.line)}`
      : team;
    const live = b.game_status === 'live' && b.live_home_score != null;
    const score = b.home_score != null ? ` · ${b.home_score}–${b.away_score}`
      : live ? ` · ${b.live_home_score}–${b.live_away_score} live` : '';
    const res = b.status === 'won' ? `+${money(b.payout - b.stake)}`
      : b.status === 'lost' ? `−${money(b.stake)}`
      : b.status === 'void' ? 'refunded' : `→ ${money(b.stake * b.odds)}`;
    return `<button class="bet" style="width:100%;text-align:left;display:block"
        onclick="openGame(${b.game_id})">
      <div class="h"><strong>${esc(pick)}</strong>
        <span class="s ${b.status}" style="${live && b.status === 'open' ? 'color:var(--up)' : ''}">
          ${live && b.status === 'open' ? 'in play' : b.status}</span></div>
      <div class="d">${esc(b.home_name || '?')} v ${esc(b.away_name || '?')}${score}
        &nbsp;·&nbsp; ${money(b.stake)} @ ${Number(b.odds).toFixed(2)} &nbsp;·&nbsp; ${res}</div>
    </button>`;
  }
}


// --- stats dashboard -------------------------------------------------------
//
// Six views over the same payload. Each one leads with a rate and shows the
// count behind it, because a bare count mostly measures how much a team has
// played — and on a page comparing clubs that have played two games with clubs
// that have played four, that would be actively misleading.
const STAT_VIEWS = [
  { key: 'breaks',  label: 'Breaks',
    note: 'Points won while on defence. The rail is every defensive point a club has played; the lit part is the ones they broke. Two clubs on the same percentage no longer look identical — you can see which has done it more often.',
    part: (t) => t.breaks, whole: (t) => t.dPoints, rate: (t) => t.breakPct, min: 10,
    fmt: (t) => pctText(t.breakPct),
    sub: (t) => `${t.breaks} breaks from ${t.dPoints} D points` },

  { key: 'holds',   label: 'Holds',
    note: 'Points held when receiving. The rail is every offensive point played, lit where they held. A team that is never broken only has to break once.',
    part: (t) => t.holds, whole: (t) => t.oPoints, rate: (t) => t.holdPct, min: 10,
    fmt: (t) => pctText(t.holdPct),
    sub: (t) => `${t.holds} holds from ${t.oPoints} O points` },

  { key: 'otime',   label: 'O point length',
    note: 'How long an offensive point takes this club, on average. Shorter is better: a quick point means the disc went down the field cleanly, a long one means turnovers and grinding it back. Averaged rather than totalled, because a total mostly measures how many games a club has played. Quickest first.',
    plain: true, lowerIsBetter: true, min: 10, whole: (t) => t.oClockN,
    value: (t) => (t.oSecsPerPoint === null ? Infinity : t.oSecsPerPoint),
    fmt: (t) => (t.oSecsPerPoint === null ? '—' : `${t.oSecsPerPoint}s`),
    sub: (t) => `${clock(t.oTime)} total on offence, over ${t.oClockN} points` },

  { key: 'dtime',   label: 'D point length',
    note: 'How long a defensive point lasts. Read it with the break rate: short points and a high break rate is a defence forcing quick turnovers, while short points and a low break rate just means the other side is holding easily. Longest first — a defence that keeps the point alive is doing something.',
    plain: true, min: 10, whole: (t) => t.dClockN,
    value: (t) => (t.dSecsPerPoint === null ? -1 : t.dSecsPerPoint),
    fmt: (t) => (t.dSecsPerPoint === null ? '—' : `${t.dSecsPerPoint}s`),
    sub: (t) => `${clock(t.dTime)} total on defence, over ${t.dClockN} points` },

  { key: 'spread',  label: 'Star reliance',
    note: 'How much of a club\'s scoring comes from three people. The rail is every goal and assist the club has produced and the lit part is their top three\'s share, so a long rail mostly dark is a squad scoring from everywhere. Neither end is better — a high number is a side with a weapon, and also a side that a single shutdown defender or one injury can flatten. Most concentrated first.',
    part: (t) => t.topThree, whole: (t) => t.contributions, rate: (t) => t.concentration, min: 12,
    neutral: true,
    fmt: (t) => (t.concentration === null ? '—' : pctText(t.concentration)),
    sub: (t) => (t.topThreeNames && t.topThreeNames.length
      ? `${t.topThreeNames.map((p) => `${p.name} ${p.total}`).join(', ')} · ${t.contributors} have scored`
      : `${t.contributors} have scored`) },

  { key: 'timeouts', label: 'After a timeout',
    note: 'Whether calling a timeout actually wins you the next point. Taking them is not the story — every side takes them, and a club that calls four is not doing better or worse than one that calls two. The rail is the points that followed a timeout and the lit part is the ones they went on to score. Small samples are visibly small: a short rail is a couple of timeouts and no more.',
    part: (t) => t.timeoutsConverted, whole: (t) => t.timeouts, rate: (t) => t.timeoutConversion, min: 5,
    fmt: (t) => (t.timeouts ? pctText(t.timeoutConversion) : '—'),
    sub: (t) => (t.timeouts
      ? `scored ${t.timeoutsConverted} of the ${t.timeouts} points that followed`
      : 'no timeouts called') },
];

const pctText = (v) => (v === null || v === undefined ? '—' : `${v}%`);
function clock(seconds) {
  const s = Math.max(0, Math.round(seconds || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m`;
}

async function renderStats() {
  if (!S.stats || S.statsDiv !== (S.statDivision || '')) {
    const q = S.statDivision ? `?division=${encodeURIComponent(S.statDivision)}` : '';
    S.stats = await api('/stats' + q);
    S.statsDiv = S.statDivision || '';
  }
  const d = S.stats;
  const view = STAT_VIEWS.find((v) => v.key === (S.statView || 'breaks')) || STAT_VIEWS[0];

  if (!d.coverage.points) {
    return `<div class="empty">No point-by-point data yet.<br>
      <span style="font-size:12px">It arrives a few minutes after each game finishes.</span></div>`;
  }

  const divs = [['', 'All divisions'], ['Open', 'Open'], ["Women's", "Women's"], ['Mixed', 'Mixed']];
  const divBar = `<div class="stat-tabs">${divs.map(([k, l]) =>
    `<button class="${(S.statDivision || '') === k ? 'on' : ''}"
       onclick="S.statDivision='${k.replace(/'/g, "\\'")}';S.stats=null;render()">${l}</button>`).join('')}</div>`;

  const viewBar = `<div class="stat-tabs">${STAT_VIEWS.map((v) =>
    `<button class="${v.key === view.key ? 'on' : ''}"
       onclick="S.statView='${v.key}';render()">${v.label}</button>`).join('')}</div>`;

  const c = d.coverage;
  const dropped = Math.max(0, c.points - c.anchoredPoints);
  const cov = `<div class="cov">
    <b>${c.points.toLocaleString()}</b> points across <b>${c.ingestedGames}</b> games, every one
    played so far.${dropped ? ` <b>${dropped}</b> of them had no recorded opening offence, so who
      was on which line can't be known — those are dropped from breaks, holds and O/D time.
      Their goals and assists still count.` : ''}
  </div>`;

  // Divisions never play each other, so a single ranked list of all 136 clubs
  // silently compares teams with no common opponents. Each block is also
  // scaled to its own busiest club, which is why they can't be read across.
  const body = S.statDivision
    ? statTable(sortForView(d.teams, view), view, null)
    : ['Open', "Women's", 'Mixed'].map((div) => {
        const rows = sortForView(d.teams.filter((t) => t.division === div), view);
        if (!rows.length) return '';
        return statTable(rows.slice(0, 10), view, div, rows.length);
      }).join('');

  const scaleNote = view.plain ? ''
    : `<div class="mnote">Rails are scaled within each division, to the club with the most
       ${esc(view.label.toLowerCase() === 'breaks' ? 'defensive points' : 'of them')} — so lengths
       compare down a block, never across two.</div>`;

  return divBar + viewBar + cov + body +
    `<div class="mnote">${esc(view.note)}</div>` + scaleNote +
    playerBlock(d.players, S.statDivision);
}

// Sorting. Clubs with barely any data sink rather than topping the table on a
// 100% rate from four points. Ties break on volume: two clubs on 66.7% are not
// equally convincing when one has done it 20 times and the other 10.
// Enough of a sample for THIS stat, which is not the same question as whether
// the club has played much. Fury's fourteen defensive points make a fine break
// rate and their single offensive point makes a meaningless hold rate.
function enough(view, t) {
  return (view.whole(t) || 0) >= (view.min || 0);
}

function sortForView(teams, view) {
  const val = (t) => (view.plain ? view.value(t) : (view.rate(t) ?? -1));
  const vol = (t) => view.whole(t) || 0;
  return teams.slice().sort((a, b) => {
    const ea = enough(view, a), eb = enough(view, b);
    if (ea !== eb) return ea ? -1 : 1;
    const d = view.lowerIsBetter ? val(a) - val(b) : val(b) - val(a);
    return d !== 0 ? d : vol(b) - vol(a);
  });
}

function statTable(rows, view, division, totalInDivision) {
  const head = division
    ? `<button class="dayhead" onclick="S.statDivision='${division.replace(/'/g, "\\'")}';S.stats=null;render()">
         <span class="dh-l">${esc(division)}</span>
         <span class="dh-n">${totalInDivision} clubs</span>
         <span class="dh-c">›</span></button>`
    : '';

  // Par: the pooled rate across everything in view. Drawn on each rail at the
  // point its fill would reach if the club performed exactly at that rate, so
  // "past the tick" means above average whatever the club's volume.
  const totPart = view.plain ? 0 : rows.reduce((n, t) => n + (view.part(t) || 0), 0);
  const totWhole = view.plain ? 0 : rows.reduce((n, t) => n + (view.whole(t) || 0), 0);
  const par = totWhole > 0 ? totPart / totWhole : 0;
  const maxWhole = view.plain ? 0 : Math.max(1, ...rows.map((t) => view.whole(t) || 0));
  let parPlain = null;
  if (view.plain) {
    const vals = rows.filter((t) => enough(view, t))
      .map((t) => view.value(t)).filter((v) => Number.isFinite(v));
    parPlain = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  }

  return head + `<div class="rail-card">${rows.map((t, i) => {
    const whole = view.plain ? 0 : (view.whole(t) || 0);
    const part = view.plain ? 0 : (view.part(t) || 0);
    // "Good" is not always "more". On time-on-offence and on pace, a smaller
    // number is the better one, so the green has to follow the meaning of the
    // stat rather than the direction of the bar.
    const good = view.neutral ? false : view.plain
      ? (parPlain !== null && (view.value(t) <= parPlain) === true && enough(view, t))
      : (whole > 0 && (view.lowerIsBetter ? part / whole <= par : part / whole >= par));
    return `<div class="rl ${enough(view, t) ? '' : 'thin'}">
      <span class="rl-rk">${i + 1}</span>
      <span class="rl-main">
        <span class="rl-name"><span class="who">${esc(t.name)}</span>
          <span class="ctry">${esc(t.country || '')}</span></span>
        ${view.plain ? '' : `<span class="rl-rail">
          <i class="rl-w" style="width:${(whole / maxWhole) * 100}%"></i>
          <i class="rl-p ${view.neutral ? 'neutral' : (good ? '' : 'under')}"
             style="width:${(part / maxWhole) * 100}%"></i>
          <s class="rl-par" style="left:${((whole * par) / maxWhole) * 100}%"></s>
        </span>`}
        <span class="rl-sub">${esc(view.sub(t))} · ${t.games} game${t.games === 1 ? '' : 's'}</span>
      </span>
      <span class="rl-val ${good ? 'up' : ''}">${view.fmt(t)}</span>
    </div>`;
  }).join('')}</div>`;
}

function playerBlock(p, division) {
  const scope = division ? ` · ${division}` : ' · all divisions';
  const list = (title, rows, key, unit) => `<div class="day">${title}${scope}</div>
    <div class="lb">${rows.slice(0, 10).map((r, i) => `<div class="r">
      <span class="rk">${i + 1}</span>
      <span class="nm">${esc(r.name || 'Unknown')}
        <div class="sub">${esc(r.team || '')}</div></span>
      <span class="v">${r[key]}<span style="font-size:10px;color:var(--dim)"> ${unit}</span></span>
    </div>`).join('')}</div>`;
  return list('Most goals', p.goals, 'goals', 'G') +
         list('Most assists', p.assists, 'assists', 'A') +
         list('Goals + assists', p.combined, 'total', 'G+A');
}

// --- leaderboards ----------------------------------------------------------
async function renderLeaders() {
  const d = await api('/leaderboard');
  const tabs = [['bankroll', 'Profit'], ['daily', 'Today'], ['roi', 'ROI'], ['biggest', 'Biggest win']];
  let html = `<div class="tabs">${tabs.map(([k, l]) =>
    `<button class="${S.lbTab === k ? 'on' : ''}" onclick="S.lbTab='${k}';render()">${l}</button>`).join('')}</div>`;

  const rows = {
    bankroll: () => d.bankroll.map((r, i) => row(i, r.display_name,
      `${r.net >= 0 ? '+' : '−'}${money(Math.abs(r.net))}`, bankrollSub(r), r.net >= 0)),
    daily: () => d.daily.map((r, i) => row(i, r.display_name,
      `${r.net >= 0 ? '+' : '−'}${money(Math.abs(r.net))}`,
      `${r.wins}/${r.settled} settled today`, r.net >= 0)),
    roi: () => d.roi.map((r, i) => row(i, r.display_name,
      `${r.roi > 0 ? '+' : ''}${r.roi}%`, `${money(r.staked)} staked`, r.roi >= 0)),
    biggest: () => d.biggest.map((r, i) => row(i, r.display_name,
      `+${money(r.profit)}`, bigSub(r), true)),
  }[S.lbTab]();

  return html + (rows.length ? `<div class="lb">${rows.join('')}</div>`
    : `<div class="empty">Nothing here yet.</div>`);
}

// "0/0 won" reads as someone who has never bet. Say what's actually true:
// a record only once there is one, and money still riding whenever there is.
// What the bet actually was. The profit alone doesn't say whether someone
// called an upset or leaned on a favourite with a big stake.
function bigSub(r) {
  const pick = r.pick
    ? (r.market === 'spread' && r.line !== null
        ? `${r.pick} ${r.line > 0 ? '−' : '+'}${Math.abs(r.line)}`
        : r.pick)
    : 'a pick';
  const bits = [`${esc(pick)} @ ${Number(r.odds).toFixed(2)}`];
  if (r.against) bits.push(`v ${esc(r.against)}${r.score ? ` ${r.score}` : ''}`);
  bits.push(`${money(r.stake)} → ${money(r.payout)}`);
  if (r.in_play) bits.push('in-play');
  return bits.join(' · ');
}

function bankrollSub(r) {
  const parts = [`${money(r.bankroll)} bucks`];
  if (r.bets > 0) parts.push(`${r.wins}/${r.bets} won`);
  if (r.openBets > 0) parts.push(`${money(r.atRisk)} on ${r.openBets} open`);
  if (r.topups) parts.push(`${r.topups} top-up${r.topups > 1 ? 's' : ''}`);
  return parts.join(' · ');
}

function row(i, name, value, sub, good) {
  const col = good === undefined ? '' : `style="color:${good ? 'var(--up)' : 'var(--down)'}"`;
  return `<div class="r"><span class="rk">${i + 1}</span>
    <span class="nm">${esc(name)}<div class="sub">${esc(sub)}</div></span>
    <span class="v" ${col}>${value}</span></div>`;
}

// --- live -------------------------------------------------------------------
async function loadLive() {
  const d = await api('/live');
  S.live = d.games || [];
  S.liveCount = S.live.length;
}

function renderLive() {
  if (!S.live?.length) {
    return `<div class="empty">Nothing in progress.<br>
      <span style="font-size:12px">Games move here from Upcoming the moment they start.</span>
      <div style="margin-top:16px"><button class="btn ghost" onclick="go('board')">
        See upcoming games</button></div></div>`;
  }
  return `<div class="livenote"><strong>These games have already started.</strong>
    You're betting on the score as it stands, and the price moves with every point.
    Betting pauses for a few seconds after each score — we hear about it slightly late,
    and whoever's pitch-side doesn't.</div>` +
    S.live.map(liveCard).join('');
}

function liveCard(g) {
  // Decided beats suspended: once the score is at the target the game is over,
  // and nothing about it is bettable again.
  const suspended = g.decided || g.suspendedFor > 0;
  const state = g.decided ? 'FINAL' : g.suspendedFor > 0 ? `PAUSED ${g.suspendedFor}s` : 'LIVE';
  return `<div class="game live"${g.decided ? ' style="opacity:.72"' : ''}>
    <div class="meta">
      <span class="pill">${esc(g.division || '')}</span>
      ${g.pool ? `<span>${esc(g.pool)}</span>` : ''}
      ${g.capped && !g.decided
        ? `<span class="pill" style="color:var(--down)">CAP · to ${g.target}</span>` : ''}
      <span class="t" style="color:${g.decided ? 'var(--dim)'
        : g.suspendedFor > 0 ? 'var(--down)' : 'var(--up)'}">${state}</span>
    </div>
    <div class="livescore">
      <span class="ls-n">${esc(g.home.name)}</span>
      <span class="ls-s">${g.score.home}<span class="ls-d">–</span>${g.score.away}</span>
      <span class="ls-n" style="text-align:right">${esc(g.away.name)}</span>
    </div>
    <div class="winbar"><span style="width:${Math.round(g.home.prob * 100)}%"></span></div>
    <div class="winpct">
      <span>${Math.round(g.home.prob * 100)}%</span>
      <span>${Math.round(g.away.prob * 100)}%</span>
    </div>
    <div class="sides" style="margin-top:9px">
      ${liveBtn(g, 'home', suspended)}${liveBtn(g, 'away', suspended)}
    </div>
    ${g.decided ? `<div style="font-size:11px;color:var(--dim);margin:7px 4px 0">
      Result stands — waiting on the official confirmation to settle.</div>` : ''}
  </div>`;
}

function liveBtn(g, side, suspended) {
  const t = g[side];
  // Server-priced, like every other market. Never recompute odds here: the
  // browser doesn't apply the 1.02 floor and would show prices below evens.
  const odds = typeof t.decimal === 'number' ? t.decimal : null;
  const on = S.sel && String(S.sel.gameId) === String(g.id) && S.sel.side === side;
  return `<button class="side ${on ? 'sel' : ''}" ${suspended ? 'disabled style="opacity:.45"' : ''}
      onclick="${suspended ? '' : `pickLive(${g.id},'${side}')`}">
    <span class="nm"><div class="n1">${esc(t.name)}</div>
      <div class="n2">${t.seed ? '#' + t.seed : ''}</div></span>
    <span class="od">${odds ? odds.toFixed(2) : '—'}</span></button>`;
}

function pickLive(gameId, side) {
  if (!S.user) return openAuth('signup');
  const g = S.live.find(x => String(x.id) === String(gameId));
  if (!g) return;
  const odds = g[side].decimal;
  if (typeof odds !== 'number') return;
  S.sel = { gameId, side, market: 'moneyline', line: null,
            name: `${g[side].name} (live ${g.score.home}–${g.score.away})`, odds, stake: 500 };
  $('#view').innerHTML = renderLive();
  renderSlip();
}

// --- one game, and who backed what -----------------------------------------
async function openGame(id) {
  $('#modal').innerHTML = `<div class="modal"><div class="sheet">
    <p class="lede">Loading…</p></div></div>`;
  try {
    const d = await api('/game/' + id);
    const g = d.game;
    const rows = d.bets.map(b => `<div class="r">
      <span class="nm">${esc(b.display_name)}
        <div class="sub">${b.side === 'home' ? esc(g.home.name) : esc(g.away.name)}
          @ ${Number(b.odds).toFixed(2)}</div></span>
      <span class="v ${b.status === 'won' ? '' : ''}"
        style="color:${b.status === 'won' ? 'var(--up)' : b.status === 'lost' ? 'var(--down)' : 'var(--text)'}">
        ${money(b.stake)}</span></div>`).join('');

    $('#modal').innerHTML = `<div class="modal"><div class="sheet">
      <h2 style="font-size:17px">${esc(g.home.name)} v ${esc(g.away.name)}</h2>
      <p class="lede">${esc(g.division || '')}${g.poolName ? ' · ' + esc(g.poolName) : ''}
        · ${fmtTime(g.startsAt)} · ${fmtIrish(g.startsAt)} Limerick</p>
      <div class="lb" style="margin-bottom:12px">
        <div class="r"><span class="nm">${esc(g.home.name)}</span>
          <span class="v">${g.home.decimal.toFixed(2)}</span></div>
        <div class="r"><span class="nm">${esc(g.away.name)}</span>
          <span class="v">${g.away.decimal.toFixed(2)}</span></div>
      </div>
      ${d.revealed
        ? (rows
            ? `<div style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;
                 color:var(--dim);margin:0 4px 8px;font-weight:700">Who backed what</div>
               <div class="lb">${rows}</div>`
            : `<div class="empty" style="padding:24px">Nobody bet on this one.</div>`)
        : `<div class="empty" style="padding:24px">Bets are hidden until this game starts.<br>
             <span style="font-size:12px">${d.bets.length === 0 ? '' : ''}They'll be public at
             ${fmtTime(g.startsAt)}.</span></div>`}
      <div class="note"><button onclick="$('#modal').innerHTML=''" style="color:var(--dim)">Close</button></div>
    </div></div>`;
  } catch (e) {
    $('#modal').innerHTML = `<div class="modal"><div class="sheet">
      <p class="lede">${esc(e.message)}</p>
      <button class="btn" onclick="$('#modal').innerHTML=''">Close</button></div></div>`;
  }
}

// --- account ---------------------------------------------------------------
function renderAccount() {
  const u = S.user;
  return `
    <div class="lb" style="margin-bottom:14px">
      <div class="r"><span class="nm">Name<div class="sub">Shown on the leaderboard</div></span>
        <span class="v">${esc(u.displayName)}</span></div>
      <div class="r"><span class="nm">Bucks<div class="sub">Play money. No real value.</div></span>
        <span class="v">${money(u.bankroll)}</span></div>
      <div class="r"><span class="nm">Recovery email
        <div class="sub">Only ever used to reissue a lost code. Never shown publicly.</div></span>
        <span class="v" style="color:${u.hasRecoveryEmail ? 'var(--up)' : 'var(--dim)'}">
          ${u.hasRecoveryEmail ? 'set' : 'none'}</span></div>
    </div>

    <div class="adm">
      <div style="font-weight:650;font-size:14px">Recovery email</div>
      <div class="sub" style="margin-top:3px">Leave blank and save to remove it entirely.</div>
      <div class="in"><input id="acem" type="email" style="width:100%;text-align:left"
        placeholder="you@example.com"><button class="btn" onclick="saveAccountEmail()">Save</button></div>
    </div>

    <div class="adm">
      <div style="font-weight:650;font-size:14px">New recovery code</div>
      <div class="sub" style="margin-top:3px">Use this if your code has been shared or screenshotted.
        The old one stops working immediately. You'll stay signed in here.</div>
      <div class="in"><button class="btn ghost" onclick="rotateCode()">Generate a new code</button></div>
    </div>`;
}

async function saveAccountEmail() {
  try {
    const r = await api('/email', { body: { email: $('#acem').value.trim() } });
    S.user.hasRecoveryEmail = !r.removed;
    toast(r.removed ? 'Email removed.' : 'Email saved.');
    render();
  } catch (e) { toast(e.message); }
}

async function rotateCode() {
  try {
    const r = await api('/regenerate-code', { method: 'POST' });
    showCode(r.recoveryCode, S.user, false);
  } catch (e) { toast(e.message); }
}

// --- admin -----------------------------------------------------------------
async function renderAdmin() {
  const d = await api('/admin/games');
  let html = `<div class="tabs"><button class="on" onclick="runSync()">Sync feed now</button></div>`;
  if (!d.games.length) return html + `<div class="empty">Nothing waiting to be settled.</div>`;
  html += d.games.map(g => `<div class="adm">
    <div style="font-size:13.5px;font-weight:600">${esc(g.home_name || g.home_label || '?')}
      <span style="color:var(--dim)">v</span> ${esc(g.away_name || g.away_label || '?')}</div>
    <div class="sub" style="margin-top:3px">${esc(g.division || '')} · ${esc(g.pool_name || '')}
      · ${fmtIrish(g.starts_at)} Limerick · ${g.bet_count} bet${g.bet_count === 1 ? '' : 's'}</div>
    ${g.needs_review ? `<div style="color:var(--down);font-size:11.5px;margin-top:5px;font-weight:600">
      ⚑ ${esc(g.needs_review)}</div>` : ''}
    <div class="in">
      <input id="h${g.id}" type="number" inputmode="numeric" placeholder="15" value="${g.home_score ?? ''}">
      <span style="color:var(--dim)">–</span>
      <input id="a${g.id}" type="number" inputmode="numeric" placeholder="12" value="${g.away_score ?? ''}">
      <button class="btn" onclick="settle(${g.id})">Settle</button>
      <button class="btn ghost" onclick="voidGame(${g.id})">Void</button>
    </div></div>`).join('');
  return html;
}

async function settle(id) {
  const homeScore = +$('#h' + id).value, awayScore = +$('#a' + id).value;
  if (!homeScore && !awayScore) return toast('Enter the score first.');
  try {
    await api('/admin/settle', { body: { gameId: id, homeScore, awayScore } });
    toast('Settled.'); render();
  } catch (e) { toast(e.message); }
}

async function voidGame(id) {
  const reason = prompt('Why is this game being voided?', 'Abandoned');
  if (reason === null) return;
  try {
    await api('/admin/void', { body: { gameId: id, reason } });
    toast('Voided and refunded.'); render();
  } catch (e) { toast(e.message); }
}

async function runSync() {
  toast('Syncing…');
  try {
    const r = await api('/sync?force=1', { method: 'POST' });
    toast(r.skipped ? 'Already up to date.' : `Synced — ${r.settled} settled.`);
    render();
  } catch (e) { toast(e.message); }
}

// --- auth ------------------------------------------------------------------
function openAuth(mode) {
  $('#modal').innerHTML = `<div class="modal">
    <div class="sheet">
      <h2>${mode === 'signup' ? 'Join Chalk Line' : 'Welcome back'}</h2>
      <p class="lede">${mode === 'signup'
        ? "No email needed. Pick a name, we'll give you a code to get back in, and you start with 10,000 bucks."
        : 'Enter the name and code you were given.'}</p>

      <label>Display name</label>
      <input id="dn" autocomplete="nickname" maxlength="24"
        placeholder="${mode === 'signup' ? 'Shown on the leaderboard' : ''}">

      ${mode === 'signup' ? `
        <label>Email <span style="text-transform:none;letter-spacing:0;color:var(--dim);font-weight:500">— optional, only to recover a lost code</span></label>
        <input id="em" type="email" autocomplete="email" placeholder="Leave blank if you'd rather not">
      ` : `
        <label>Recovery code</label>
        <input id="rc" autocomplete="one-time-code" placeholder="heron-cobalt-willow"
          autocapitalize="off" autocorrect="off" spellcheck="false">
      `}

      <div class="err hide" id="ae"></div>
      <button class="btn" id="ab" onclick="submitAuth('${mode}')">
        ${mode === 'signup' ? 'Create account' : 'Sign in'}</button>

      <div class="switch">${mode === 'signup'
        ? `Already playing? <button onclick="openAuth('login')">Sign in</button>`
        : `New here? <button onclick="openAuth('signup')">Create an account</button>
           <br><button onclick="openAuth('recover')" style="margin-top:8px">Lost your code?</button>`}</div>

      ${mode === 'signup' ? `<div class="note">By joining you confirm you're 18 or over and understand
        this is a play-money game with no prizes.</div>` : ''}
      <div class="note"><button onclick="$('#modal').innerHTML=''" style="color:var(--dim)">Close</button></div>
    </div></div>`;
  if (mode === 'recover') return openRecover();
  setTimeout(() => $('#dn')?.focus(), 60);
}

function openRecover() {
  $('#modal').innerHTML = `<div class="modal"><div class="sheet">
    <h2>Lost your code?</h2>
    <p class="lede">If you added an email when you signed up, we'll send a new code to it.
      Your old code stops working once the new one arrives. If you didn't add an email,
      there's no way back into that account — codes aren't stored anywhere.</p>
    <label>Email</label><input id="rem" type="email" autocomplete="email">
    <div class="err hide" id="ae"></div>
    <button class="btn" id="ab" onclick="submitRecover()">Send me a new code</button>
    <div class="switch"><button onclick="openAuth('login')">Back to sign in</button></div>
  </div></div>`;
  setTimeout(() => $('#rem')?.focus(), 60);
}

async function submitRecover() {
  const btn = $('#ab'); btn.disabled = true;
  const err = $('#ae'); err.classList.add('hide');
  try {
    const r = await api('/recover', { body: { email: $('#rem').value.trim() } });
    $('.sheet').innerHTML = `<h2>Check your email</h2>
      <p class="lede">${esc(r.message)}</p>
      <button class="btn" onclick="openAuth('login')">Sign in</button>`;
  } catch (e) {
    err.textContent = e.message; err.classList.remove('hide'); btn.disabled = false;
  }
}

// The code is shown exactly once. Make that impossible to miss.
function showCode(code, user, recoveryByEmail) {
  $('#modal').innerHTML = `<div class="modal"><div class="sheet">
    <h2>Save this code</h2>
    <p class="lede">This is the only way back into your account, and it's shown once.
      Screenshot it or put it somewhere safe.</p>
    <div style="background:var(--bg);border:1px solid var(--chalk);border-radius:10px;
      padding:16px;text-align:center;font-size:17px;font-weight:800;letter-spacing:.02em;
      font-family:ui-monospace,monospace;word-break:break-all" id="thecode">${esc(code)}</div>
    <button class="btn ghost" style="width:100%;margin-top:10px" onclick="copyCode('${esc(code)}')">Copy code</button>
    ${recoveryByEmail && !user.hasRecoveryEmail ? `
      <label style="margin-top:18px">Add an email to recover it later — optional</label>
      <input id="addem" type="email" placeholder="you@example.com">
      <button class="btn ghost" style="width:100%;margin-top:8px" onclick="attachEmail()">Save email</button>
    ` : ''}
    <button class="btn" onclick="$('#modal').innerHTML=''">I've saved it — start betting</button>
  </div></div>`;
}

function copyCode(code) {
  navigator.clipboard?.writeText(code).then(() => toast('Code copied'),
    () => toast('Select and copy it manually'));
}

async function attachEmail() {
  try {
    await api('/email', { body: { email: $('#addem').value.trim() } });
    S.user.hasRecoveryEmail = true;
    toast('Email saved — you can recover your code with it.');
  } catch (e) { toast(e.message); }
}

async function submitAuth(mode) {
  const btn = $('#ab'); btn.disabled = true;
  const err = $('#ae'); err.classList.add('hide');
  try {
    const body = { displayName: $('#dn').value.trim() };
    if (mode === 'signup') body.email = $('#em').value.trim() || undefined;
    else body.recoveryCode = $('#rc').value.trim();

    const r = await api('/' + (mode === 'signup' ? 'signup' : 'login'), { body });
    S.user = r.user;
    renderChrome(); render();
    if (mode === 'signup') showCode(r.recoveryCode, r.user, r.recoveryByEmail);
    else { $('#modal').innerHTML = ''; toast(`Welcome back — ${money(S.user.bankroll)} bucks`); }
  } catch (e) {
    err.textContent = e.message; err.classList.remove('hide'); btn.disabled = false;
  }
}

// --- render ----------------------------------------------------------------
async function render() {
  const v = $('#view');
  try {
    if (S.tab === 'board') { await loadGames(); v.innerHTML = renderBoard(); tick(); }
    else if (S.tab === 'bets') v.innerHTML = await renderBets();
    else if (S.tab === 'leaders') v.innerHTML = await renderLeaders();
    else if (S.tab === 'stats') v.innerHTML = await renderStats();
    else if (S.tab === 'admin') v.innerHTML = await renderAdmin();
    else if (S.tab === 'account') v.innerHTML = renderAccount();
    else if (S.tab === 'live') { await loadLive(); v.innerHTML = renderLive(); }
  } catch (e) {
    v.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

(async function init() {
  try { S.user = (await api('/me')).user; } catch {}
  renderChrome();
  await render();
  // Polling is the thing that scales with the number of people watching, so
  // it only runs while the tab is actually in front of someone. A phone in a
  // pocket at the fields costs nothing.
  const visible = () => document.visibilityState === 'visible';
  setInterval(() => {
    if (visible() && S.tab === 'board' && !S.sel && !S.query) render();
  }, 60000);
  // The live board is only useful if it's actually live; the feed's own cache
  // is ten seconds, so there's nothing to gain by going faster.
  setInterval(async () => {
    if (!visible()) return;
    if (S.tab === 'live') { await loadLive(); if (!S.sel) $('#view').innerHTML = renderLive(); }
    else { try { const d = await api('/live'); S.liveCount = (d.games || []).length; renderChrome(); }
           catch {} }
  }, 12000);
  document.addEventListener('visibilitychange', () => {
    if (visible() && S.tab === 'board' && !S.sel) render();
  });
})();
</script>
